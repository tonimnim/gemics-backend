          format: date-time
        resultDueAt:
          type:
            - string
            - 'null'
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        progression:
          $ref: '#/components/schemas/BracketProgression'
        version:
          type: integer
          minimum: 1
    BracketSlot:
      type: object
