        - name: minAttempts
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 12
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Signed cursor bound to the platform operator and every active filter.
          schema:
            type: string
      responses:
        '200':
          description: Payment review queue page.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReviewQueueEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/payment-reviews/{id}:
    get:
      operationId: getPaymentReview
      tags:
        - Platform payment review
      summary: Get safe payment, callback-processing and staff-action history.
      description: >-
        Callback bytes, request IP and the payer's full phone number are never returned. Each history list is bounded to
        100 items and reports truncation.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Safe review detail.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReviewDetailEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/payment-reviews/{id}/decisions:
    post:
      operationId: decidePaymentReview
      tags:
        - Platform payment review
      summary: Safely retry provider verification, replay stored callbacks or record failure.
      description: >-
        There is deliberately no manual success action. Success remains possible only through the existing callback path
        after independent Daraja query validation of checkout ID, receipt, amount and phone. A succeeded payment is
        immutable.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - retry_query
                    - replay_callbacks
                    - mark_failed
                note:
                  type: string
                  maxLength: 1000
                  default: ''
                  description: Required and non-empty for mark_failed.
            examples:
              retryQuery:
                value:
                  decision: retry_query
                  note: Retry after Safaricom support confirmed recovery.
              replayCallbacks:
                value:
                  decision: replay_callbacks
              fail:
                value:
                  decision: mark_failed
                  note: No collection exists after provider investigation.
      responses:
        '200':
          description: Payment safely marked failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReviewDecisionEnvelope'
        '202':
          description: A bounded provider-query cycle or callback replay was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReviewDecisionEnvelope'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/result-reviews:
    get:
      operationId: listResultReviews
      tags:
        - Platform result review
      summary: List a signed, operator-bound page of the Gamics result review queue.
