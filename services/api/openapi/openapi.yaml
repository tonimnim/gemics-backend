          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/organizations/{orgId}/competitions/{competitionId}/transitions:
    post:
      operationId: transitionOrganizerCompetition
      tags:
        - Organizer
      summary: Move a competition to the next lifecycle status.
      description: >-
        Requires competition.publish (owner, admin). Legal targets for the current status are published
        in the allowedTransitions field. Additional guards: publishing requires a future start time; opening
        registration requires a future closing time; check-in requires at least two active entries; running
        requires a generated bracket (409 bracket_not_generated); completing requires every match to be
        finished, forfeited or cancelled. Cancelling a competition also cancels every match that is not
        finished yet (completionReason competition_cancelled), settles open result verifications and closes
        queued Gamics reviews, in the same transaction. Nobody is removed from the tournament, no rating
        changes and no strike is recorded.
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/CompetitionStatus'
                reason:
                  type: string
                  maxLength: 500
                  description: Recorded in the audit event. Expected when cancelling.
      responses:
        '200':
          description: Status changed. The response carries the competition's new allowed transitions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizerCompetition'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
