# Docker Compose >=2.24.4. Merge after compose.yaml; see docs/cloudflare-r2.md.
services:
  # Preserve local data volumes, but do not start MinIO in an R2 deployment.
  minio:
    profiles: [local-storage]
  minio-init:
    profiles: [local-storage]

  api:
    environment:
      STORAGE_MODE: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID in .env.r2}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET in .env.r2}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env.r2}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env.r2}
      R2_JURISDICTION: ${R2_JURISDICTION:-}
      STORAGE_S3_ACCESS_KEY: ""
      STORAGE_S3_SECRET_KEY: ""
      STORAGE_S3_SESSION_TOKEN: ""
    depends_on: !override
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy

  evidence-worker:
    environment:
      STORAGE_MODE: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID in .env.r2}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET in .env.r2}
      R2_ACCESS_KEY_ID: ${R2_WORKER_ACCESS_KEY_ID:?set read-only R2_WORKER_ACCESS_KEY_ID in .env.r2}
      R2_SECRET_ACCESS_KEY: ${R2_WORKER_SECRET_ACCESS_KEY:?set read-only R2_WORKER_SECRET_ACCESS_KEY in .env.r2}
      R2_JURISDICTION: ${R2_JURISDICTION:-}
      STORAGE_S3_ACCESS_KEY: ""
      STORAGE_S3_SECRET_KEY: ""
      STORAGE_S3_SESSION_TOKEN: ""
