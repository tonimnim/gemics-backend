openapi: 3.1.0
info:
  title: Gamics API
  version: 0.7.0
  description: >-
    Gamics player, competition, blind match result verification, Gamics result review, rankings, M-Pesa payments,
    notification, identity and role-based operations API.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      tags:
        - Operations
      responses:
        '200':
          description: Process is alive.
  /readyz:
    get:
      operationId: getReadiness
      tags:
        - Operations
      responses:
        '200':
          description: The writer is ready; reader or Redis degradation is reported in the body.
        '503':
          description: A required dependency is unavailable.
  /v1/games:
    get:
      operationId: listGames
      tags:
        - Games
      responses:
        '200':
          description: Supported competitive games.
          headers:
            ETag:
              schema:
                type: string
            X-Cache:
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
                  - STALE
                  - BYPASS
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
  /v1/auth/otp/request:
    post:
      operationId: requestEmailOTP
      tags:
        - Authentication
      summary: Send a passwordless sign-in code by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: The request was accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - expiresInSeconds
                properties:
                  status:
                    type: string
                    const: accepted
                  expiresInSeconds:
                    type: integer
        '429':
          $ref: '#/components/responses/Error'
  /v1/auth/otp/verify:
    post:
      operationId: verifyEmailOTP
      tags:
        - Authentication
      summary: Verify an email code and create or sign in the player.
      description: >-
        A new account gets a generated handle such as Swift_Falcon_4821 and a private profile. The handle is also
        its display name until the player chooses one, so player.onboarding.displayName starts false. No name is
        ever derived from the email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^[0-9]{6}$
                deviceName:
                  type: string
                  maxLength: 120
      responses:
        '200':
          description: Authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
          description: >-
            database_unavailable, or handle_unavailable when no generated handle could be claimed for a new
            account; retry the same code.
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Authentication
      summary: Rotate a refresh token and issue a new access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Rotated authenticated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Error'
  /v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Authentication
      description: >-
        Revokes the current session and every push installation registered with it, so the device stops receiving
        the player's pushes. The app should still call DELETE /v1/me/push-tokens/{id} for its installation first:
        an installation registered with an earlier session of the same device is not bound to this one.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current refresh session and its push installations revoked.
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      operationId: getCurrentPlayer
      tags:
        - Players
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current player and onboarding progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '401':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateCurrentPlayer
      tags:
        - Players
      description: Setting displayName completes the display-name onboarding step.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 80
                  description: The name opponents and public profiles show. Setting it marks onboarding.displayName true.
                countryCode:
                  type: string
                  pattern: ^[A-Z]{2}$
                birthDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Updated player.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '400':
          $ref: '#/components/responses/Error'
          description: >-
            invalid_display_name (2-80 characters), invalid_country, invalid_birth_date, empty_update,
            versioned_legal_acceptance_required.
  /v1/me/profile:
    put:
      operationId: putPlayerProfile
      tags:
        - Players
      description: While onboarding.displayName is false, the display name follows the handle set here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: Updated player and profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
        '409':
          $ref: '#/components/responses/Error'
  /v1/me/game-accounts:
    get:
      operationId: listMyGameAccounts
      tags:
        - Game accounts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Connected game accounts.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GameAccount'
    post:
      operationId: createGameAccount
      tags:
        - Game accounts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameAccountInput'
      responses:
        '201':
          description: Connected game account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccount'
  /v1/me/game-accounts/{id}:
    patch:
      operationId: updateGameAccount
      tags:
        - Game accounts
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                inGameName:
                  type: string
                  minLength: 2
                  maxLength: 80
                publisherPlayerId:
                  type:
                    - string
                    - 'null'
      responses:
        '200':
          description: Updated game account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccount'
        '404':
          $ref: '#/components/responses/Error'
  /v1/payments/mpesa/stk-push:
    post:
      operationId: initiateMPesaRegistrationPayment
      tags:
        - Payments
      summary: Reserve a competition place and send an M-Pesa STK prompt.
      description: >-
        A confirmed provider payment creates the competition entry atomically. Reuse the same Idempotency-Key when
        retrying the same request. Poll GET /v1/payments/{id} until status is succeeded, failed or review, then read
        registrationStatus: a verified payment that completes after its place is gone reads succeeded with
        registrationStatus refund_pending and a mandatory refund.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - competitionId
                - gameAccountId
                - phoneNumber
              properties:
                competitionId:
                  type: string
                  format: uuid
                gameAccountId:
                  type: string
                  format: uuid
                phoneNumber:
                  type: string
                  description: Kenyan Safaricom number; local or 254 format is accepted.
      responses:
        '200':
          description: Idempotent replay of an existing request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '202':
          description: STK prompt accepted by Daraja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/payments/{id}:
    get:
      operationId: getPayment
      tags:
        - Payments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >-
            Current payment status, the registration outcome (registrationStatus) and the latest refund. Only the
            payer can read a payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/payments/mpesa/callback/{token}:
    post:
      operationId: receiveMPesaCallback
      tags:
        - Provider callbacks
      summary: Daraja-only callback endpoint; mobile clients must never call it.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Callback durably accepted and processed or queued for replay.
        '400':
          $ref: '#/components/responses/Error'
        '404':
          description: Invalid callback token.
        '503':
          $ref: '#/components/responses/Error'
  /v1/me/matches:
    get:
      operationId: listMyMatches
      tags:
        - Matches
      summary: List the signed-in player's active or historical match assignments.
      description: >-
        Uses signed keyset cursors. The server derives lifecycle and allowedActions for the authenticated
        participant; summaries never carry a score claim.
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
            enum:
              - active
              - history
            default: active
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 1024
      responses:
        '200':
          description: A bounded page of participant-authorized matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/matches/{matchId}:
    get:
      operationId: getMatch
      tags:
        - Matches
      summary: Return a participant match room with an explicit verification policy.
      description: >-
        The room is the caller's blind view. It never contains the opponent's score before the match is
        resolved: resultVerification says only whether the opponent reported or responded, and the canonical
        result appears once the match is completed.
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized participant match room.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRoomWithVerificationResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
          description: match_not_found (missing, or the caller is not a starter or substitute of either
            entry).
        '503':
          $ref: '#/components/responses/Error'
  /v1/matches/{matchId}/check-ins:
    post:
      operationId: checkInMatch
      tags:
        - Matches
      summary: Check the signed-in participant's side into a match.
      description: >-
        Locks and version-checks the match. The second side atomically moves a ready match to in_progress. Reuse the
        same Idempotency-Key after a network failure.
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        '200':
          description: The side is checked in, or was already checked in.
          headers:
            Idempotency-Replayed:
              description: True when the original response for this key was replayed.
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRoomResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/evidence/{id}:
    get:
      operationId: getEvidenceAccess
      tags:
        - Evidence
      summary: Obtain short-lived private access to a processed screenshot.
      description: >-
        Evidence is visible to its uploader, and to active Gamics platform reviewers and admins once it
        is attached to something. A reviewer or admin who plays in, captains an entry in, or belongs to
        the organization of the match a score-report screenshot belongs to reaches it only as its uploader.
        Opponents and organizers never reach another player's evidence; they get the same 404 as for a
        missing upload.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Short-lived signed private download.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceAccessEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
          description: evidence_not_found (missing, not processed, or not visible to the caller).
        '503':
          $ref: '#/components/responses/Error'
          description: evidence_storage_unavailable, database_unavailable.
  /v1/evidence/uploads:
    post:
      operationId: createEvidenceUpload
      tags:
        - Evidence
      summary: Create a checksum-bound private JPEG or PNG screenshot upload.
      description: >-
        Convert HEIC/HEIF to JPEG before calculating size and SHA-256. The signed PUT binds Content-Length,
        Content-Type, If-None-Match=* and the SHA-256; upload the raw bytes, not multipart/form-data.
        Per-player request and daily byte budgets return 429 with Retry-After.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvidenceUpload'
      responses:
        '201':
          description: Short-lived signed PUT intent. The required headers must be sent unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntentEnvelope'
        '400':
          $ref: '#/components/responses/Error'
          description: >-
            invalid_request; invalid_evidence_upload (not JPEG or PNG, a video or a durationSeconds field,
            a size outside the limit, or a malformed checksum).
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
          description: evidence_rate_limited, with Retry-After.
        '500':
          $ref: '#/components/responses/Error'
          description: internal_error.
        '503':
          $ref: '#/components/responses/Error'
          description: >-
            evidence_limits_unavailable (upload protection is down; retry after Retry-After), evidence_storage_unavailable,
            database_unavailable.
  /v1/evidence/uploads/{id}/complete:
    post:
      operationId: completeEvidenceUpload
      tags:
        - Evidence
      summary: Durably queue an uploaded screenshot for asynchronous verification.
      description: >-
        Returns processing with ready=false. Poll GET /v1/evidence/uploads/{id} with backoff until ready=true
        before attaching the screenshot to a final score report. Repeating completion is safe. The screenshot
        worker verifies the JPEG/PNG structure, dimensions, decode budget, size and SHA-256; a legacy
        video upload is failed with processing error video_unsupported.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Verification queued, or the current state for an idempotent completion retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
          description: evidence_not_found.
        '409':
          $ref: '#/components/responses/Error'
          description: evidence_not_pending.
        '410':
          $ref: '#/components/responses/Error'
          description: evidence_upload_expired.
        '422':
          $ref: '#/components/responses/Error'
          description: evidence_media_unsupported (a legacy video upload; video evidence is not accepted).
        '429':
          $ref: '#/components/responses/Error'
          description: evidence_rate_limited, with Retry-After.
        '503':
          $ref: '#/components/responses/Error'
          description: >-
            evidence_limits_unavailable (with Retry-After), evidence_storage_unavailable, database_unavailable.
  /v1/matches/{matchId}/score-reports:
    post:
      operationId: createScoreReport
      tags:
        - Match results
      summary: Report your entry's score, blind (score only, no screenshot).
      description: >-
        Any starter or substitute may report once for their entry. The first report starts the other entry's
        report window (verificationPolicy.reportWindowSeconds, 10 minutes by default) and a reminder push
        reaches that entry reminderBeforeDeadlineSeconds before the window ends. A second report that
        agrees with the first (same totals and tiebreak; the games breakdown is ignored) confirms the
        result at once, advances the bracket and applies ratings. A second report that differs opens the
        response window, and both entries are told only that the scores don't match. If the other entry
        stays silent, the worker removes it from the tournament when the window ends and the reporter
        wins by forfeit. If nobody reports by resultDueAt, both entries are removed. The response and
        every error depend only on the caller's own entry and never reveal the opponent's score.
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreReportRequest'
            examples:
              scoreOnly:
                value:
                  homeScore: 2
                  awayScore: 1
                  declarationAccepted: true
              penalties:
                value:
                  homeScore: 1
                  awayScore: 1
                  tiebreak:
                    type: penalties
                    homeScore: 4
                    awayScore: 3
                  declarationAccepted: true
      responses:
        '201':
          description: Report stored. The body is the caller's blind room and the report just stored.
          headers:
            Idempotency-Replayed:
              description: Present with the value true when the stored response for this key was replayed.
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreReportResponseEnvelope'
        '400':
          $ref: '#/components/responses/Error'
          description: >-
            idempotency_key_required, invalid_idempotency_key; invalid_request (malformed body or unknown
            field); invalid_score_report (declarationAccepted is not true, or a score is outside 0..99);
            invalid_score (games or tiebreak do not fit the stage's best-of and format).
        '401':
          $ref: '#/components/responses/Error'
          description: authentication_required, invalid_access_token, invalid_session.
        '404':
          $ref: '#/components/responses/Error'
          description: >-
            match_not_found (unknown or malformed id, or the caller is not a starter or substitute of
            either entry).
        '409':
          $ref: '#/components/responses/Error'
          description: >-
            competition_closed (the competition is cancelled or completed); report_not_allowed (the match
            is not in progress or awaiting the second report); report_already_submitted (the caller's
            entry already reported); report_window_closed (resultDueAt passed before any report, or the
            report window ended); match_changed (a concurrent change; refresh and retry); idempotency_conflict.
        '500':
          $ref: '#/components/responses/Error'
          description: internal_error.
        '503':
          $ref: '#/components/responses/Error'
          description: database_unavailable, session_check_unavailable.
  /v1/matches/{matchId}/score-reports/final:
    post:
      operationId: createFinalScoreReport
      tags:
        - Match results
      summary: Submit your entry's one final score with screenshots after a mismatch.
      description: >-
        Allowed only while resultVerification.phase is awaiting_responses and before responseDeadline.
        Each entry may respond once with its final score and one to three of its own screenshots that
        are processed (ready=true), JPEG or PNG, and not attached to anything else. The current claims
        are compared after every response: agreement confirms the result at once; a lone differing response
        waits for the other entry; two differing responses send the match to the Gamics review queue.
        When the window ends, a non-responder is removed from the tournament and a lone responder advances;
        if nobody responded, both entries are removed. A non-responder whose screenshot is still stuck
        in Gamics' own processing is never removed; the match goes to Gamics review instead. The response
        and every error never reveal the opponent's score.
      security:
        - bearerAuth: []
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalScoreReportRequest'
            example:
              homeScore: 2
              awayScore: 1
              evidenceIds:
                - 4d3e5536-bf3c-4dba-a643-575e43f56970
              declarationAccepted: true
      responses:
        '201':
          description: >-
            Final report stored and its screenshots attached. The body is the caller's blind room and
            the final report just stored.
          headers:
            Idempotency-Replayed:
              description: Present with the value true when the stored response for this key was replayed.
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreReportResponseEnvelope'
        '400':
          $ref: '#/components/responses/Error'
          description: >-
            idempotency_key_required, invalid_idempotency_key; invalid_request; invalid_score_report;
            invalid_score; invalid_evidence (not one to three distinct evidence UUIDs).
        '401':
          $ref: '#/components/responses/Error'
          description: authentication_required, invalid_access_token, invalid_session.
        '404':
          $ref: '#/components/responses/Error'
          description: match_not_found.
        '409':
          $ref: '#/components/responses/Error'
          description: >-
            competition_closed; response_not_allowed (the match is not awaiting mismatch responses); response_already_submitted
            (the caller's entry already responded); response_window_closed; evidence_not_ready (a screenshot
            is not the caller's, not processed, not JPEG/PNG, or already used); match_changed; idempotency_conflict.
        '500':
          $ref: '#/components/responses/Error'
          description: internal_error.
        '503':
          $ref: '#/components/responses/Error'
          description: database_unavailable, session_check_unavailable.
