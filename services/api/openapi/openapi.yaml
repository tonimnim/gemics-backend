  /v1/me/push-tokens:
    post:
      operationId: upsertPushToken
      tags:
        - Devices
      summary: Register or rotate the current installation's Expo push token.
      description: >-
        deviceId is the stable app-installation identifier. Repeating this call is idempotent for that player/device
        pair. A new token replaces the old one, and a provider token previously assigned to another installation or
        player is revoked. The installation is bound to the caller's session: logout, revoking that session with
        DELETE /v1/me/sessions/{id} and account deletion stop its pushes, so register again after every sign-in and on
        each app launch. Installations registered before sessions were linked were revoked and must be registered
        again. Returns 401 invalid_session when the session has already ended. Each push's data object is
        PushNotificationData.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - deviceId
                - token
                - platform
              properties:
                deviceId:
                  type: string
                  minLength: 1
                  maxLength: 160
                token:
                  type: string
                  minLength: 20
                  maxLength: 512
                  pattern: ^(ExponentPushToken|ExpoPushToken)\[[A-Za-z0-9_-]{20,480}\]$
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                appVersion:
                  type: string
                  maxLength: 64
                  default: ''
      responses:
        '200':
          description: Installation registered or rotated. The provider token is never echoed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDevice'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/me/push-tokens/{id}:
    delete:
      operationId: revokePushToken
      tags:
        - Devices
      summary: Revoke one of the player's push-enabled installations.
      description: >-
        Call this for the device's own installation before POST /v1/auth/logout. If the installation ID was not
        kept, POST /v1/me/push-tokens with the same deviceId and token returns it.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Push token revoked. Repeating against the same owned record is safe.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
