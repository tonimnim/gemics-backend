    CompetitionEligibilityResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/CompetitionEligibility'
    CompetitionEligibility:
      type: object
      additionalProperties: false
      required:
        - competitionId
        - gameId
        - status
        - eligible
        - canRegisterNow
        - requiredAction
        - entryFeeMinor
        - currency
        - requirements
        - issues
        - paymentId
        - evaluatedAt
      properties:
        competitionId:
          type: string
          format: uuid
        gameId:
          type: string
        status:
          type: string
          enum:
            - eligible
            - ineligible
            - registered
        eligible:
          type: boolean
          description: False only when at least one blocking issue exists.
        canRegisterNow:
          type: boolean
          description: True only for a free, eligible competition ready for the registration POST.
        requiredAction:
          type: string
          enum:
            - none
            - submit_registration
            - start_payment
            - poll_payment
            - view_registration
            - view_refund
        entryFeeMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        requirements:
          $ref: '#/components/schemas/CompetitionEligibilityRequirements'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/CompetitionEligibilityIssue'
        paymentId:
          type:
            - string
            - 'null'
          format: uuid
          description: >-
            The player's latest payment for this competition, or null. Whenever it is not null, read it with
            GET /v1/payments/{id} and act on its status and registrationStatus, whatever requiredAction says; that
            payment also carries the refund when requiredAction is view_refund. requiredAction is poll_payment while
            the payment is unfinished (initiating, pending, callback_received or review), even when a blocking
            issue such as registration_closed or competition_full stops a new entry.
        evaluatedAt:
          type: string
          format: date-time
    CompetitionEligibilityRequirements:
      type: object
      additionalProperties: false
      required:
        - minimumAge
        - allowedCountries
        - minimumRating
        - maximumRank
        - requireVerifiedGameAccount
      properties:
        minimumAge:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 100
        allowedCountries:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Z]{2}$
        minimumRating:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 10000
        maximumRank:
          type:
            - integer
            - 'null'
          minimum: 1
        rankingScope:
          type: string
          enum:
            - global
            - country
        requireVerifiedGameAccount:
          type: boolean
    CompetitionEligibilityIssue:
      type: object
      additionalProperties: false
      required:
        - code
        - category
        - severity
        - message
      properties:
        code:
          type: string
          enum:
            - profile_incomplete
            - registration_not_reusable
            - registration_not_open
            - registration_closed
            - competition_full
            - age_required
            - minimum_age_not_met
            - country_not_allowed
            - rating_unavailable
            - minimum_rating_not_met
            - ranking_unavailable
            - maximum_rank_not_met
            - game_account_required
            - game_account_game_mismatch
            - verified_game_account_required
            - payment_required
            - payment_pending
            - payment_processing
            - payment_retry_required
            - conduct_suspended
          description: >-
            profile_incomplete means onboarding is unfinished (see Player.onboarding), including a pending display name.
            conduct_suspended blocks new registrations while the player holds at least the platform's
            active conduct strike threshold (3 by default). Existing entries are unaffected.
        category:
          type: string
          enum:
            - profile
            - registration
            - capacity
            - age
            - country
            - ranking
            - game_account
            - payment
            - conduct
        severity:
          type: string
          enum:
            - blocking
            - action_required
        message:
          type: string
    MatchVerificationPolicy:
      type: object
      additionalProperties: false
      description: >-
        The windows of the blind dual score report. They are snapshotted when the first report opens verification,
        so a later rules edit never moves a live deadline; before that they are resolved from the competition's
        matchVerification rules.
      required:
        - reportWindowSeconds
        - reminderBeforeDeadlineSeconds
        - responseWindowSeconds
        - finalReportEvidence
      properties:
        reportWindowSeconds:
          type: integer
          format: int64
          minimum: 300
          maximum: 3600
          description: How long the other entry has to report after the first report (10 minutes by default).
        reminderBeforeDeadlineSeconds:
          type: integer
          format: int64
          minimum: 60
          description: >-
            When the reminder push reaches a silent entry, before the report window ends (3 minutes by
            default). Always less than reportWindowSeconds.
        responseWindowSeconds:
          type: integer
          format: int64
          minimum: 300
          maximum: 3600
          description: >-
            How long each entry has to submit its final score after a mismatch (10 minutes by default).
        finalReportEvidence:
          type: object
          additionalProperties: false
          required:
            - minItems
            - maxItems
            - mediaTypes
          properties:
            minItems:
              type: integer
              const: 1
            maxItems:
              type: integer
              const: 3
            mediaTypes:
              type: array
              items:
                type: string
                enum:
                  - image/jpeg
                  - image/png
    CompetitionMatchVerificationRules:
      type: object
      additionalProperties: false
      description: >-
        rules.matchVerification on a competition. Every field is optional and whole minutes. Writes reject
        any other key, including the retired evidenceRequirement, confirmationWindowMinutes, autoConfirmEnabled
        and refereeMonitoring, with 400 invalid_match_verification_rules. Stored values outside the bounds
        are ignored on read and the defaults apply.
      properties:
        reportWindowMinutes:
          type: integer
          minimum: 5
          maximum: 60
          default: 10
        reminderBeforeDeadlineMinutes:
          type: integer
          minimum: 1
          default: 3
          description: Must be less than the report window.
        responseWindowMinutes:
          type: integer
          minimum: 5
          maximum: 60
          default: 10
    MatchRoomWithVerificationResponse:
