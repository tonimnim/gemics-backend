            - winner_of
            - loser_of
        entryId:
          type:
            - string
            - 'null'
          format: uuid
        matchId:
          type:
            - string
            - 'null'
          format: uuid
        sourceGraphRank:
          type:
            - integer
            - 'null'
          minimum: 1
        resolvedEntryId:
          type:
            - string
            - 'null'
          format: uuid
        resolvedAt:
          type:
            - string
            - 'null'
          format: date-time
        voidedAt:
          type:
            - string
            - 'null'
          format: date-time
    BracketScore:
      type: object
      additionalProperties: false
      required:
        - submissionId
        - homeScore
        - awayScore
        - tiebreak
        - confirmedAt
      properties:
        submissionId:
          type: string
          format: uuid
        homeScore:
          type: integer
          minimum: 0
          maximum: 99
        awayScore:
          type: integer
          minimum: 0
          maximum: 99
        tiebreak:
          oneOf:
            - $ref: '#/components/schemas/TiebreakScore'
            - type: 'null'
        confirmedAt:
          type: string
          format: date-time
    BracketProgression:
      type: object
      additionalProperties: false
      required:
        - graphRank
        - activationRule
        - activationSourceMatchId
        - completionReason
      properties:
        graphRank:
          type: integer
          minimum: 1
        activationRule:
          type: string
          enum:
            - unconditional
            - if_source_away_wins
        activationSourceMatchId:
          type:
            - string
            - 'null'
          format: uuid
        completionReason:
          type:
            - string
            - 'null'
          description: >-
            See MatchCompletionReason. referee is a legacy history value that is never written any more.
          enum:
            - played
            - walkover
            - double_no_show
            - timeout_forfeit
            - reset_not_required
            - correction_voided
            - report_timeout
            - response_timeout
            - no_result_reported
            - platform_review
            - competition_cancelled
            - referee
            - null
    PaymentReviewQueueEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentReviewItem'
        page:
          $ref: '#/components/schemas/PaymentReviewPage'
    PaymentReviewPage:
      type: object
      additionalProperties: false
      required:
        - nextCursor
        - hasMore
      properties:
        nextCursor:
          type:
            - string
            - 'null'
        hasMore:
          type: boolean
    PaymentReviewItem:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - playerDisplayName
        - competitionId
        - competitionName
        - entryId
        - amountMinor
        - currency
        - phoneNumber
        - status
        - merchantRequestId
        - checkoutRequestId
        - providerReceipt
        - providerResultCode
        - providerResultDescription
        - queryAttempts
        - lastQueryAt
        - nextQueryAt
        - createdAt
        - updatedAt
        - completedAt
        - callbackCount
        - pendingCallbackCount
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        playerDisplayName:
          type: string
        competitionId:
          type: string
          format: uuid
        competitionName:
          type: string
        entryId:
          type:
            - string
            - 'null'
          format: uuid
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          const: KES
        phoneNumber:
          type: string
          pattern: ^254[17]\*{5}[0-9]{3}$
          description: Masked projection only.
        status:
          type: string
          enum:
            - initiating
            - pending
            - callback_received
            - succeeded
            - failed
            - review
        merchantRequestId:
          type:
            - string
            - 'null'
        checkoutRequestId:
          type:
            - string
            - 'null'
        providerReceipt:
          type:
            - string
            - 'null'
        providerResultCode:
          type:
            - string
            - 'null'
        providerResultDescription:
          type:
            - string
            - 'null'
        queryAttempts:
          type: integer
          minimum: 0
        lastQueryAt:
          type:
            - string
            - 'null'
          format: date-time
        nextQueryAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        callbackCount:
          type: integer
          minimum: 0
        pendingCallbackCount:
          type: integer
          minimum: 0
    PaymentReviewDetailEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - payment
            - callbackEvents
            - actions
            - callbacksTruncated
            - actionsTruncated
          properties:
            payment:
              $ref: '#/components/schemas/PaymentReviewItem'
            callbackEvents:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/PaymentReviewCallbackEvent'
            actions:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/PaymentReviewAuditEvent'
            callbacksTruncated:
              type: boolean
            actionsTruncated:
              type: boolean
    PaymentReviewCallbackEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - merchantRequestId
        - requestId
        - payloadSha256
        - receivedAt
        - processedAt
        - processingError
      properties:
        id:
          type: integer
          format: int64
        merchantRequestId:
          type:
            - string
            - 'null'
        requestId:
          type:
            - string
            - 'null'
        payloadSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type:
            - string
            - 'null'
          format: date-time
        processingError:
          type:
            - string
            - 'null'
    PaymentReviewAuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - actorUserId
        - action
        - requestId
        - beforeState
        - afterState
        - occurredAt
      properties:
        id:
          type: integer
          format: int64
        actorUserId:
          type:
            - string
            - 'null'
          format: uuid
        action:
          type: string
        requestId:
          type:
            - string
            - 'null'
        beforeState:
          type:
            - object
            - 'null'
          additionalProperties: true
        afterState:
          type:
            - object
            - 'null'
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    PaymentReviewDecisionEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - payment
            - decision
            - callbackReplayRequested
            - queryAttemptBudget
          properties:
            payment:
              $ref: '#/components/schemas/PaymentReviewItem'
            decision:
              type: string
              enum:
                - retry_query
                - replay_callbacks
                - mark_failed
            callbackReplayRequested:
              type: boolean
              description: True when the committed action requested callback replay; it does not claim a callback proved success.
            queryAttemptBudget:
              type: integer
              const: 12
    ResultReviewStatus:
      type: string
      description: >-
        queued reviews wait for a decision; decided reviews carry one; closed reviews left the queue because
        the competition was cancelled.
      enum:
        - queued
        - decided
        - closed
      default: queued
    ResultReviewReason:
      type: string
      description: >-
        reports_differ when both entries responded to a mismatch and still disagree; evidence_unavailable
        when the response window ended while a non-responder's screenshot was still stuck in Gamics' own
        processing, so nobody was removed. Never sent to players.
      enum:
        - reports_differ
        - evidence_unavailable
    ResultReviewDecisionCode:
      type: string
      enum:
        - accept_home
        - accept_away
        - corrected_score
        - remove_both
    ResultReviewMatch:
      type: object
      additionalProperties: false
      required:
        - id
        - competitionId
        - competitionName
        - gameId
        - stageFormat
        - bracket
        - roundNumber
        - matchNumber
        - bestOf
      properties:
        id:
          type: string
          format: uuid
        competitionId:
          type: string
          format: uuid
        competitionName:
          type: string
        gameId:
          type: string
        stageFormat:
          type: string
          enum:
            - single_elimination
            - double_elimination
            - round_robin
        bracket:
          type: string
        roundNumber:
          type: integer
          minimum: 1
        matchNumber:
          type: integer
          minimum: 1
        bestOf:
          type: integer
          minimum: 1
    ResultReviewSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - reason
        - version
        - queuedAt
        - decision
        - decidedAt
        - decidedBy
        - match
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ResultReviewStatus'
        reason:
          $ref: '#/components/schemas/ResultReviewReason'
        version:
          type: integer
          minimum: 1
          description: Send as expectedVersion when deciding.
        queuedAt:
          type: string
          format: date-time
        decision:
          oneOf:
            - $ref: '#/components/schemas/ResultReviewDecisionCode'
            - type: 'null'
        decidedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the review was decided or closed.
        decidedBy:
          type:
            - string
            - 'null'
          format: uuid
          description: The staff decider; null for a closed review or a system decider.
        match:
          $ref: '#/components/schemas/ResultReviewMatch'
    ResultReviewParticipant:
      type: object
      additionalProperties: false
      required:
        - entryId
        - entryStatus
        - captainUserId
        - displayName
        - handle
      properties:
        entryId:
          type: string
          format: uuid
        entryStatus:
          type: string
          enum:
            - registered
            - checked_in
            - accepted
            - withdrawal_pending
            - withdrawn
            - disqualified
        captainUserId:
          type: string
          format: uuid
        displayName:
          type: string
        handle:
          type:
            - string
            - 'null'
    StaffScoreReportView:
      type: object
      additionalProperties: false
      description: One entry's claim as Gamics staff see it. Players never receive this view.
      required:
        - id
        - reportedBy
        - homeScore
        - awayScore
        - tiebreak
        - games
        - reportedAt
        - evidence
      properties:
        id:
          type: string
          format: uuid
        reportedBy:
          type: object
          additionalProperties: false
          required:
            - userId
            - displayName
          properties:
            userId:
              type: string
              format: uuid
            displayName:
              type: string
        homeScore:
          type: integer
          minimum: 0
          maximum: 99
        awayScore:
          type: integer
          minimum: 0
          maximum: 99
        tiebreak:
          oneOf:
            - $ref: '#/components/schemas/TiebreakScore'
            - type: 'null'
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameScore'
        reportedAt:
          type: string
          format: date-time
        evidence:
          type: array
          maxItems: 3
          description: Screenshots of a final report, in submission order; empty for an initial report.
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - mediaType
              - byteSize
              - ready
            properties:
              id:
                type: string
                format: uuid
              mediaType:
                type: string
                enum:
                  - image/jpeg
                  - image/png
              byteSize:
                type: integer
                format: int64
              ready:
                type: boolean
    ResultReviewEntryReports:
      type: object
      additionalProperties: false
      required:
        - initial
        - final
      properties:
        initial:
          oneOf:
            - $ref: '#/components/schemas/StaffScoreReportView'
            - type: 'null'
        final:
          oneOf:
            - $ref: '#/components/schemas/StaffScoreReportView'
            - type: 'null'
    ReviewScore:
      type: object
      additionalProperties: false
      required:
        - homeScore
        - awayScore
      properties:
        homeScore:
          type: integer
          minimum: 0
          maximum: 99
        awayScore:
          type: integer
          minimum: 0
          maximum: 99
        games:
          type: array
          maxItems: 99
          description: Optional 1..bestOf breakdown; one aggregate game is recorded when omitted.
          items:
            $ref: '#/components/schemas/GameScore'
        tiebreak:
          oneOf:
            - $ref: '#/components/schemas/TiebreakScore'
            - type: 'null'
    ResultReviewDecisionView:
      type: object
      additionalProperties: false
      required:
        - decision
        - correctedScore
        - note
        - deciderKind
        - decidedBy
        - deciderRef
        - decidedAt
      properties:
        decision:
          $ref: '#/components/schemas/ResultReviewDecisionCode'
        correctedScore:
          oneOf:
            - $ref: '#/components/schemas/ReviewScore'
            - type: 'null'
        note:
          type: string
        deciderKind:
          type: string
          enum:
            - staff
            - system
          description: system is reserved for a future automated decider, which can neither correct a score nor record strikes.
        decidedBy:
          type:
            - string
            - 'null'
          format: uuid
        deciderRef:
          type:
            - string
            - 'null'
          maxLength: 128
        decidedAt:
          type: string
          format: date-time
    ResultReviewWindowUpload:
      type: object
      additionalProperties: false
      description: >-
        An upload a non-responding entry's player made during the response window of an
        evidence_unavailable review, with its current status. Completed uploads can be opened
        through GET /v1/evidence/{id}.
      required:
        - entryId
        - evidenceId
        - uploadedBy
        - status
        - processingErrorCode
        - createdAt
      properties:
        entryId:
          type: string
          format: uuid
        evidenceId:
          type: string
          format: uuid
        uploadedBy:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - rejected
            - expired
        processingErrorCode:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    ResultReviewDetail:
      type: object
      additionalProperties: false
      description: >-
        The summary fields plus both entries' claims. Here decision is the full decision object, or null
        until the review is decided.
      required:
        - id
        - status
        - reason
        - version
        - queuedAt
        - decision
        - decidedAt
        - decidedBy
        - match
        - participants
        - reports
        - verification
        - responseWindowUploads
        - activeStrikeCounts
        - strikes
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ResultReviewStatus'
        reason:
          $ref: '#/components/schemas/ResultReviewReason'
        version:
          type: integer
          minimum: 1
        queuedAt:
          type: string
          format: date-time
        decision:
          oneOf:
            - $ref: '#/components/schemas/ResultReviewDecisionView'
            - type: 'null'
        decidedAt:
          type:
            - string
            - 'null'
          format: date-time
        decidedBy:
          type:
            - string
            - 'null'
          format: uuid
        match:
          $ref: '#/components/schemas/ResultReviewMatch'
        participants:
          type: object
          additionalProperties: false
          required:
            - home
            - away
          properties:
            home:
              $ref: '#/components/schemas/ResultReviewParticipant'
            away:
              $ref: '#/components/schemas/ResultReviewParticipant'
        reports:
          type: object
          additionalProperties: false
          required:
            - home
            - away
          properties:
            home:
              $ref: '#/components/schemas/ResultReviewEntryReports'
            away:
              $ref: '#/components/schemas/ResultReviewEntryReports'
        verification:
          type: object
          additionalProperties: false
          required:
            - firstReportEntryId
            - firstReportedAt
            - reportDeadlineAt
            - mismatchAt
            - responseDeadlineAt
          properties:
            firstReportEntryId:
              type: string
              format: uuid
            firstReportedAt:
              type: string
              format: date-time
            reportDeadlineAt:
              type: string
              format: date-time
            mismatchAt:
              type:
                - string
                - 'null'
              format: date-time
            responseDeadlineAt:
              type:
                - string
                - 'null'
              format: date-time
        responseWindowUploads:
          type: array
          description: >-
            Filled only for reason evidence_unavailable, otherwise empty: every upload the
            non-responders' players made during the response window, with its current status. The
            screenshot that was stuck at the deadline stays listed after processing completes.
          items:
            $ref: '#/components/schemas/ResultReviewWindowUpload'
        activeStrikeCounts:
          type: object
          description: Active strike count for every user who reported on this match, keyed by user id.
          additionalProperties:
            type: integer
            minimum: 0
        strikes:
          type: array
          description: Strikes recorded by this review's decision.
          items:
            $ref: '#/components/schemas/PlayerStrike'
    ResultReviewDecisionRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - decision
        - note
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        decision:
          $ref: '#/components/schemas/ResultReviewDecisionCode'
        correctedScore:
          description: >-
            Required for corrected_score and forbidden for every other decision. Validated against the
            stage's best-of and format.
          oneOf:
            - $ref: '#/components/schemas/ReviewScore'
            - type: 'null'
        strikeUserIds:
          type: array
          maxItems: 2
          uniqueItems: true
          description: >-
            Reporters of current claims this decision rejects: the away reporter for accept_home, the
            home reporter for accept_away, either reporter whose claim differs from a corrected score,
            and either reporter for remove_both. A claim equal to the accepted one cannot be struck.
          items:
            type: string
            format: uuid
        note:
          type: string
          minLength: 10
          maxLength: 2000
    ResultReviewPageEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ResultReviewSummary'
        page:
          $ref: '#/components/schemas/CursorPage'
    ResultReviewEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ResultReviewDetail'
    PlayerStrike:
      type: object
      additionalProperties: false
      description: >-
        A conduct strike recorded by a Gamics review against the reporter of a rejected claim. Active
        strikes count towards the registration ban.
      required:
        - id
        - userId
        - matchId
        - reviewId
        - reasonCode
        - note
        - createdByKind
        - createdBy
        - createdAt
        - revokedAt
        - revokedBy
        - revokeReason
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        matchId:
          type: string
          format: uuid
        reviewId:
          type: string
          format: uuid
        reasonCode:
          type: string
          const: false_result_report
        note:
          type: string
        createdByKind:
          type: string
          const: staff
        createdBy:
          type:
            - string
            - 'null'
          format: uuid
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
        revokedBy:
          type:
            - string
            - 'null'
          format: uuid
        revokeReason:
          type:
            - string
            - 'null'
    PlayerStrikeEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PlayerStrike'
    PlayerStrikePageEnvelope:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlayerStrike'
        page:
          $ref: '#/components/schemas/CursorPage'
    PlayerStrikeRevocationRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Printable ASCII without spaces. Reuse the same key to retry after a network failure.
      schema:
        type: string
        minLength: 8
        maxLength: 128
