    OrganizerDrawRequest:
      type: object
      required:
        - seedingPolicy
        - expectedStatus
        - config
      additionalProperties: false
      properties:
        seedingPolicy:
          type: string
          enum:
            - seeded
            - rating
            - random
            - registration_order
          description: >-
            seeded orders organizer seeds first then unseeded entries by registration; rating orders the frozen game
            rating descending; registration_order uses registration time; random sorts keyed hashes made from the
            disclosed draw seed and entry IDs.
        expectedStatus:
          type: string
          enum:
            - check_in
          description: >-
            Optimistic state guard. A stale organizer screen receives 409 instead of generating against a changed
            competition.
        config:
          $ref: '#/components/schemas/OrganizerDrawConfig'
    OrganizerDrawConfig:
      type: object
      additionalProperties: false
      properties:
        bestOf:
          type: integer
          minimum: 1
          maximum: 9
          default: 1
          description: Must be odd.
        thirdPlace:
          type: boolean
          default: false
          description: Single elimination only.
        groupCount:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
          description: Round robin only; every group needs at least two active entries.
        doubleRoundRobin:
          type: boolean
          default: false
          description: Round robin only.
        checkInLeadMinutes:
          type: integer
          minimum: 5
          maximum: 180
          default: 15
        checkInGraceMinutes:
          type: integer
          minimum: 0
          maximum: 60
          default: 10
        resultWindowMinutes:
          type: integer
          minimum: 15
          maximum: 1440
          default: 60
          description: >-
            Must be at least checkInGraceMinutes + 15, so a late but valid check-in still leaves time to play. When
            nobody reports a score by the result deadline, both entries are removed from the tournament.
        roundIntervalMinutes:
          type: integer
          minimum: 15
          maximum: 1440
          default: 90
          description: Must be at least resultWindowMinutes.
    OrganizerDraw:
      type: object
      required:
        - competitionId
        - stageId
        - algorithm
        - algorithmVersion
        - seedingPolicy
        - drawSeed
        - entryCount
        - matchCount
        - entryFingerprint
        - graphFingerprint
        - config
        - entries
        - generatedBy
        - generatedAt
      additionalProperties: false
      properties:
        competitionId:
          type: string
          format: uuid
        stageId:
          type: string
          format: uuid
        algorithm:
          type: string
          enum:
            - materialized_bracket_graph
        algorithmVersion:
          type: integer
          enum:
            - 1
        seedingPolicy:
          type: string
          enum:
            - seeded
            - rating
            - random
            - registration_order
        drawSeed:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 32-byte seed as lowercase hexadecimal. Random only for random policy; a deterministic commitment otherwise.
        entryCount:
          type: integer
          minimum: 2
          maximum: 1024
        matchCount:
          type: integer
          minimum: 1
          maximum: 10000
        entryFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        graphFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        config:
