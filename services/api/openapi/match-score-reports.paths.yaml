# Match results: one entry submits the result, the other confirms or rejects
# it, and after a rejection each entry sends one screenshot. Merge this OpenAPI
# 3.1 fragment with the main contract, which defines MatchRoom, GameScore,
# TiebreakScore, MatchVerificationPolicy and the Error response.
#
# Auth: every operation needs a signed-in player who is a starter or substitute
# of one of the match's entries. Anyone else, including coaches, organizers and
# Gamics staff, gets 404 match_not_found, exactly as for a missing match.
# Idempotency: every operation requires an Idempotency-Key. Keys are scoped to
# the caller, the match and the action, so a replay returns the caller's own
# stored response with Idempotency-Replayed: true.
# Visibility: both entries see the submitted result.
# Of the other entry's screenshot the room shows only whether it was sent.
paths:
  /v1/matches/{matchId}/score-reports:
    post:
      operationId: createScoreReport
      tags: [Match results]
      summary: Submit the match result (either entry, once).
      description: >-
        Either entry submits the full score once, after both checked in and before resultDueAt. The other
        entry is then asked to confirm or reject it within verificationPolicy.reportWindowSeconds (10
        minutes by default), with a reminder push reminderBeforeDeadlineSeconds before the end. If it
        doesn't answer in time, the submitted result stands. If nobody submits a result by resultDueAt,
        both entries are removed.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScoreReportRequest" }
            examples:
              scoreOnly: { value: { homeScore: 2, awayScore: 1, declarationAccepted: true } }
              penalties:
                value: { homeScore: 1, awayScore: 1, tiebreak: { type: penalties, homeScore: 4, awayScore: 3 }, declarationAccepted: true }
      responses:
        "201":
          description: Result submitted. The body is the caller's room.
          headers:
            Idempotency-Replayed:
              description: Present with the value true when the stored response for this key was replayed.
              schema: { type: string, enum: ["true"] }
          content: { application/json: { schema: { $ref: "#/components/schemas/ScoreReportResponseEnvelope" } } }
        "400":
          $ref: "#/components/responses/Error"
          description: >-
            idempotency_key_required, invalid_idempotency_key; invalid_request (malformed body or unknown
            field); invalid_score_report (declarationAccepted is not true, or a score is outside 0..99);
            invalid_score (games or tiebreak do not fit the stage's best-of and format).
        "401":
          $ref: "#/components/responses/Error"
          description: authentication_required, invalid_access_token, invalid_session.
        "404":
          $ref: "#/components/responses/Error"
          description: match_not_found (unknown or malformed id, or the caller is not a starter or substitute of either entry).
        "409":
          $ref: "#/components/responses/Error"
          description: >-
            competition_closed (the competition is cancelled or completed); report_not_allowed (the match is
            not in progress); result_already_submitted (the caller's entry already submitted the result);
            result_awaiting_confirmation (the other entry already submitted it; confirm or reject it
            instead); report_window_closed (resultDueAt passed); match_changed (a concurrent change; refresh
            and retry); idempotency_conflict.
        "500":
          $ref: "#/components/responses/Error"
          description: internal_error.
        "503":
          $ref: "#/components/responses/Error"
          description: database_unavailable, session_check_unavailable.
  /v1/matches/{matchId}/score-reports/confirmation:
    post:
      operationId: createResultConfirmation
      tags: [Match results]
      summary: Confirm or reject the result the other entry submitted.
      description: >-
        Allowed only to the entry that did not submit the result, while resultVerification.phase is
        awaiting_confirmation and before confirmationDeadline. confirm settles the submitted result at
        once, advances the bracket and applies ratings. reject opens the screenshot window
        (verificationPolicy.responseWindowSeconds): each entry then sends one screenshot of the Full Time
        screen.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultConfirmationRequest" }
            examples:
              confirm: { value: { decision: confirm } }
              reject: { value: { decision: reject } }
      responses:
        "201":
          description: Answer recorded. The body is the caller's room.
          headers:
            Idempotency-Replayed:
              description: Present with the value true when the stored response for this key was replayed.
              schema: { type: string, enum: ["true"] }
          content: { application/json: { schema: { $ref: "#/components/schemas/ScoreReportResponseEnvelope" } } }
        "400":
          $ref: "#/components/responses/Error"
          description: idempotency_key_required, invalid_idempotency_key; invalid_request; invalid_decision (not confirm or reject).
        "401":
          $ref: "#/components/responses/Error"
          description: authentication_required, invalid_access_token, invalid_session.
        "404":
          $ref: "#/components/responses/Error"
          description: match_not_found.
        "409":
          $ref: "#/components/responses/Error"
          description: >-
            competition_closed; confirmation_not_allowed (no submitted result is awaiting an answer);
            own_result (the caller's entry submitted it); confirmation_window_closed; match_changed;
            idempotency_conflict.
        "500":
          $ref: "#/components/responses/Error"
          description: internal_error.
        "503":
          $ref: "#/components/responses/Error"
          description: database_unavailable, session_check_unavailable.
  /v1/matches/{matchId}/score-reports/screenshot:
    post:
      operationId: createResultScreenshot
      tags: [Match results]
      summary: Send your entry's one screenshot after a rejection.
      description: >-
        Allowed while resultVerification.phase is awaiting_screenshots and before screenshotDeadline.
        Each entry sends exactly one of its own processed (ready=true) JPEG or PNG uploads that is not
        attached to anything else. Once both entries sent theirs, the match goes to the Gamics review
        queue, where the screenshot reader reads both. When the window ends, an entry that sent none is
        removed from the tournament and the other advances; if neither sent one, both are removed. An
        entry whose screenshot is still stuck in Gamics' own processing is never removed; the match goes
        to Gamics review instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResultScreenshotRequest" }
            example: { evidenceId: "4d3e5536-bf3c-4dba-a643-575e43f56970" }
      responses:
        "201":
          description: Screenshot attached. The body is the caller's room.
          headers:
            Idempotency-Replayed:
              description: Present with the value true when the stored response for this key was replayed.
              schema: { type: string, enum: ["true"] }
          content: { application/json: { schema: { $ref: "#/components/schemas/ScoreReportResponseEnvelope" } } }
        "400":
          $ref: "#/components/responses/Error"
          description: idempotency_key_required, invalid_idempotency_key; invalid_request; invalid_evidence (not an evidence UUID).
        "401":
          $ref: "#/components/responses/Error"
          description: authentication_required, invalid_access_token, invalid_session.
        "404":
          $ref: "#/components/responses/Error"
          description: match_not_found.
        "409":
          $ref: "#/components/responses/Error"
          description: >-
            competition_closed; screenshot_not_allowed (the match is not awaiting screenshots);
            screenshot_already_submitted (the caller's entry already sent one); screenshot_window_closed;
            evidence_not_ready (the screenshot is not the caller's, not processed, not JPEG/PNG, or already
            used); match_changed; idempotency_conflict.
        "500":
          $ref: "#/components/responses/Error"
          description: internal_error.
        "503":
          $ref: "#/components/responses/Error"
          description: database_unavailable, session_check_unavailable.

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Printable ASCII without spaces. Reuse the same key to retry after a network failure.
      schema: { type: string, minLength: 8, maxLength: 128 }
  schemas:
    ScoreReportRequest:
      type: object
      additionalProperties: false
      description: The submitted result. The other entry sees it and confirms or rejects it.
      required: [homeScore, awayScore, declarationAccepted]
      properties:
        homeScore: { type: integer, minimum: 0, maximum: 99 }
        awayScore: { type: integer, minimum: 0, maximum: 99 }
        games:
          type: array
          maxItems: 99
          description: >-
            Optional game-by-game breakdown: 1..bestOf games whose totals equal homeScore and awayScore.
            When omitted, the server records one aggregate game.
          items: { $ref: "#/components/schemas/GameScore" }
        tiebreak:
          description: Required for a tied elimination match (a penalty shootout with a winner); forbidden otherwise. Round-robin draws have no tiebreak.
          oneOf:
            - { $ref: "#/components/schemas/TiebreakScore" }
            - { type: "null" }
        declarationAccepted: { type: boolean, const: true }
    ResultConfirmationRequest:
      type: object
      additionalProperties: false
      description: The other entry's answer to the submitted result.
      required: [decision]
      properties:
        decision: { type: string, enum: [confirm, reject] }
    ResultScreenshotRequest:
      type: object
      additionalProperties: false
      description: One screenshot of the Full Time screen, sent after a rejection.
      required: [evidenceId]
      properties:
        evidenceId:
          type: string
          format: uuid
          description: The caller's own processed (ready=true) JPEG or PNG upload that is not attached to anything else.
    SubmittedResult:
      type: object
      additionalProperties: false
      description: The result one entry submitted. Both entries see it.
      required: [id, side, submittedByMe, homeScore, awayScore, tiebreak, games, submittedAt]
      properties:
        id: { type: string, format: uuid }
        side: { type: string, enum: [home, away], description: The side that submitted it. }
        submittedByMe: { type: boolean }
        homeScore: { type: integer, minimum: 0, maximum: 99 }
        awayScore: { type: integer, minimum: 0, maximum: 99 }
        tiebreak:
          oneOf:
            - { $ref: "#/components/schemas/TiebreakScore" }
            - { type: "null" }
        games:
          type: array
          items: { $ref: "#/components/schemas/GameScore" }
        submittedAt: { type: string, format: date-time }
    ResultScreenshot:
      type: object
      additionalProperties: false
      description: The viewer's own screenshot after a rejection.
      required: [id, evidenceId, submittedAt]
      properties:
        id: { type: string, format: uuid }
        evidenceId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
    ScoreReportResponseEnvelope:
      type: object
      additionalProperties: false
      description: The caller's room after the action.
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [match]
          properties:
            match: { $ref: "#/components/schemas/MatchRoom" }
    ResultVerification:
      type: object
      additionalProperties: false
      description: >-
        The viewer's view of the result: the submitted result, the viewer's own screenshot after a
        rejection, whether the other entry sent its screenshot, and the deadline of the current step.
      required: [phase, submittedResult, myScreenshot, opponentScreenshotSubmitted, confirmationDeadline, screenshotDeadline, resolution, entryRemoved]
      properties:
        phase:
          type: string
          enum: [not_started, awaiting_confirmation, awaiting_screenshots, in_review, resolved]
          description: not_started until a result is submitted. A resolved match may also stay not_started when nobody ever submitted one.
        submittedResult:
          oneOf:
            - { $ref: "#/components/schemas/SubmittedResult" }
            - { type: "null" }
        myScreenshot:
          oneOf:
            - { $ref: "#/components/schemas/ResultScreenshot" }
            - { type: "null" }
        opponentScreenshotSubmitted: { type: boolean }
        confirmationDeadline:
          type: [string, "null"]
          format: date-time
          description: End of the other entry's time to confirm or reject; set only in awaiting_confirmation.
        screenshotDeadline:
          type: [string, "null"]
          format: date-time
          description: End of the screenshot window; set only in awaiting_screenshots.
        resolution:
          type: [string, "null"]
          enum: [agreed, confirmation_timeout, response_timeout, platform_review, competition_cancelled, null]
          description: agreed when confirmed; confirmation_timeout when unanswered, so the submitted result stood.
        entryRemoved:
          type: boolean
          description: >-
            True only on the match that removed the viewer's entry from the tournament (the viewer's side
            is in the room's removals). The matches the entry played before stay false, and its later
            unfinished matches show the lifecycle out_of_competition instead.
    MatchConfirmedResult:
      type: object
      additionalProperties: false
      description: The canonical score, present only when the match state is completed.
      required: [homeScore, awayScore, tiebreak, origin, confirmedAt]
      properties:
        homeScore: { type: integer, minimum: 0, maximum: 99 }
        awayScore: { type: integer, minimum: 0, maximum: 99 }
        tiebreak:
          oneOf:
            - { $ref: "#/components/schemas/TiebreakScore" }
            - { type: "null" }
        origin:
          type: string
          enum: [agreed_reports, unanswered, platform_review, legacy]
          description: >-
            agreed_reports when the other entry confirmed the submitted result; unanswered when it didn't
            answer in time, so the submitted result stood; platform_review when Gamics decided; legacy for
            results confirmed before result verification v2.
        confirmedAt: { type: string, format: date-time }
    MatchLifecycle:
      type: string
      description: >-
        The viewer's lifecycle. report_required asks for the result; confirmation_required asks the other
        entry to confirm or reject it; screenshot_required asks for a screenshot after a rejection.
        awaiting_resolution covers the short gap between a passed deadline and the worker acting on it;
        it offers no actions. The three terminal values follow state: completed (a result was confirmed;
        see result), forfeited (decided without a score, by forfeit or walkover) and cancelled (no result;
        completionReason says why). outcome and winnerSide say who won. out_of_competition marks an
        unfinished match of an entry that was removed or withdrew: it offers no actions, never appears in
        the active list, and its round's release settles it without the entry. The match that removed an
        entry is shown by resultVerification.entryRemoved and removals.
      enum:
        - assigned
        - ready_for_check_in
        - checked_in
        - report_required
        - awaiting_opponent_confirmation
        - confirmation_required
        - screenshot_required
        - awaiting_opponent_screenshot
        - awaiting_resolution
        - under_review
        - forfeited
        - completed
        - cancelled
        - out_of_competition
    MatchAllowedAction:
      type: string
      description: >-
        check_in maps to POST /check-ins, report_score to POST /score-reports, confirm_result and
        reject_result to POST /score-reports/confirmation and submit_screenshot to POST
        /score-reports/screenshot.
      enum: [check_in, report_score, confirm_result, reject_result, submit_screenshot]
    MatchCompletionReason:
      type: [string, "null"]
      description: >-
        Why a terminal match ended. response_timeout and no_result_reported remove the silent entries
        from the tournament; platform_review is a Gamics review decision; competition_cancelled is set
        when the competition is cancelled. referee is a legacy history value that is never written any
        more.
      enum:
        - played
        - walkover
        - double_no_show
        - timeout_forfeit
        - reset_not_required
        - correction_voided
        - response_timeout
        - no_result_reported
        - platform_review
        - competition_cancelled
        - referee
        - null
