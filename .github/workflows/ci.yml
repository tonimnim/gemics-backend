name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (unit + PostgreSQL/Redis integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gamics
          POSTGRES_PASSWORD: gamics-ci
          POSTGRES_DB: gamics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamics -d gamics_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: services/api
    env:
      GOFLAGS: -buildvcs=false
      # Every TestIntegration* test skips without these; CI runs them against
      # the throwaway service containers above. Each test uses its own schema.
      GAMICS_TEST_DATABASE_URL: postgres://gamics:gamics-ci@localhost:5432/gamics_test?sslmode=disable
      GAMICS_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (unit + integration)
        run: |
          set +e
          go test -count=1 -v ./... > test.log 2>&1
          status=$?
          grep -E '^(ok|FAIL|panic:)|^\s*--- FAIL' test.log
          if [ "$status" -ne 0 ]; then
            echo "::group::Failing test output"
            grep -E -A40 '^\s*--- FAIL|^panic:' test.log | head -600
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Integration test summary
        if: always()
        run: |
          echo "### Integration tests" >> "$GITHUB_STEP_SUMMARY"
          echo "passed: $(grep -cE '^\s*--- PASS: TestIntegration' test.log || true)" >> "$GITHUB_STEP_SUMMARY"
          echo "failed: $(grep -cE '^\s*--- FAIL: TestIntegration' test.log || true)" >> "$GITHUB_STEP_SUMMARY"
          echo "skipped: $(grep -cE '^\s*--- SKIP: TestIntegration' test.log || true)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^\s*--- (FAIL|SKIP): TestIntegration' test.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-log
          path: services/api/test.log
          retention-days: 14

  api-image:
    name: API container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build services/api/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web (lint, build, render test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
