      operationId: requestGameAccountVerification
      tags:
        - Game accounts
      summary: Request Gamics manual-evidence review of a connected game account.
      description: >-
        Requires an Idempotency-Key and one to three private completed evidence uploads. Approval is a Gamics review and
        does not claim publisher verification.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - evidenceIds
              properties:
                evidenceIds:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
                note:
                  type: string
                  maxLength: 500
                  default: ''
      responses:
        '201':
          description: Verification requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccountVerificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/me/game-accounts/{id}/verification:
    get:
      operationId: getGameAccountVerification
      tags:
        - Game accounts
      summary: Return the latest verification request for a connected account.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Latest verification request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccountVerificationResponse'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/me/game-accounts/{id}/verification-requests/{requestId}:
    delete:
      operationId: withdrawGameAccountVerification
      tags:
        - Game accounts
      summary: Withdraw a pending manual verification request.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Verification request withdrawn.
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/game-account-verifications:
    get:
      operationId: listGameAccountVerificationQueue
      tags:
        - Platform operations
      summary: List the platform reviewer game-account queue.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - requested
              - under_review
              - approved
              - rejected
            default: requested
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Signed, operator- and status-bound keyset page of the verification queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccountVerificationPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/game-account-verifications/{id}/decisions:
    post:
      operationId: decideGameAccountVerification
      tags:
        - Platform operations
      summary: Approve or reject a Gamics manual-evidence account review.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - approve
                    - reject
                reason:
                  type: string
                  maxLength: 1000
                  default: ''
      responses:
        '200':
          description: Verification decided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAccountVerificationResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/evidence/uploads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getEvidenceUpload
      tags:
        - Evidence
      summary: Poll an owned evidence upload's verification status.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current upload and asynchronous processing state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
          description: evidence_not_found.
        '429':
          $ref: '#/components/responses/Error'
          description: evidence_rate_limited, with Retry-After.
        '503':
          $ref: '#/components/responses/Error'
          description: evidence_limits_unavailable (with Retry-After), database_unavailable.
  /v1/me/avatar/uploads:
    post:
      operationId: createAvatarUpload
      tags:
        - Profile media
      summary: Create a private checksum-bound avatar upload.
      description: Per-player upload-count and daily byte budgets return 429 with Retry-After.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - mediaType
                - byteSize
                - sha256
              properties:
                mediaType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                byteSize:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 10485760
                sha256:
                  type: string
                  pattern: ^[0-9a-fA-F]{64}$
      responses:
        '201':
          description: Short-lived signed private upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntentEnvelope'
        '400':
          $ref: '#/components/responses/Error'
          description: invalid_request, invalid_avatar_upload.
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
          description: avatar_rate_limited, with Retry-After.
        '500':
          $ref: '#/components/responses/Error'
          description: internal_error.
        '503':
          $ref: '#/components/responses/Error'
          description: >-
            avatar_limits_unavailable (with Retry-After), avatar_storage_unavailable, database_unavailable.
  /v1/me/avatar/uploads/{id}/complete:
    post:
      operationId: completeAvatarUpload
      tags:
        - Profile media
      summary: Verify an avatar upload's provider-reported size and checksum.
      description: Completions share a per-player per-minute limit that returns 429 with Retry-After.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Avatar media is ready to select.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
          description: avatar_upload_not_found.
        '409':
          $ref: '#/components/responses/Error'
          description: avatar_upload_not_pending, avatar_upload_incomplete.
        '410':
          $ref: '#/components/responses/Error'
          description: avatar_upload_expired.
        '422':
          $ref: '#/components/responses/Error'
          description: avatar_verification_failed.
        '429':
          $ref: '#/components/responses/Error'
          description: avatar_rate_limited, with Retry-After.
        '503':
          $ref: '#/components/responses/Error'
          description: >-
            avatar_limits_unavailable (with Retry-After), avatar_storage_unavailable, avatar_verification_unavailable,
            database_unavailable.
  /v1/me/avatar:
    patch:
      operationId: updateProfileAvatar
