        byteSize:
          type: integer
          format: int64
          minimum: 1
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    EvidenceProcessingErrorCode:
      type:
        - string
        - 'null'
      description: >-
        Set when the upload is rejected or failed. Rejected (the file is at fault): checksum_mismatch,
        size_mismatch, size_exceeded, media_type_mismatch, unsupported_image_type, invalid_image, unsupported_image_encoding,
        image_dimensions_exceeded. Failed: upload_missing (the object was never uploaded), verification_unavailable
        and processing_aborted (Gamics could not verify it; a mismatch response is then escalated to Gamics
        review instead of removing the player), video_unsupported (legacy video). legacy_error marks an
        older unclassified error.
      enum:
        - checksum_mismatch
        - size_mismatch
        - size_exceeded
        - media_type_mismatch
        - unsupported_image_type
        - invalid_image
        - unsupported_image_encoding
        - image_dimensions_exceeded
        - upload_missing
        - verification_unavailable
        - processing_aborted
        - video_unsupported
        - legacy_error
        - null
    Evidence:
      type: object
      required:
        - id
        - status
        - mediaKind
        - mediaType
        - byteSize
        - ready
        - completedAt
        - processedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
            - rejected
            - expired
        mediaKind:
          type: string
          enum:
            - image
            - video
          description: video appears only on legacy uploads, which are failed.
        mediaType:
          type: string
        byteSize:
          type: integer
          format: int64
        declaredDurationSeconds:
          type:
            - number
            - 'null'
          description: Legacy video uploads only.
        verifiedDurationSeconds:
          type:
            - number
            - 'null'
          description: Legacy video uploads only.
        processingStatus:
          type:
            - string
            - 'null'
          enum:
            - queued
            - running
            - succeeded
            - rejected
            - failed
            - null
        processingErrorCode:
          $ref: '#/components/schemas/EvidenceProcessingErrorCode'
        ready:
          type: boolean
          description: True only when status is completed.
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Client completion and verification queue time.
        processedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Asynchronous screenshot verification completion time.
