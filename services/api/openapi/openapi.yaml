  /v1/organizations/{orgId}/competitions/{competitionId}/draws:
    post:
      operationId: createOrganizerCompetitionDraw
      tags:
        - Organizer
      summary: Freeze the active field and generate the competition draw exactly once.
      description: >-
        Requires competition.write (owner or admin) and an Idempotency-Key. The competition must still be in check_in.
        The operation row-locks the competition, freezes registered/checked-in/accepted entries, creates a materialized
        bracket graph, stage, matches, dependency slots and any round-robin standings atomically. A persisted draw
        cannot be regenerated; an exact retry with the same idempotency key returns the original 201 response with
        Idempotency-Replayed: true. Random seeding uses a new cryptographically random 32-byte seed which is disclosed
        after generation so the ordered vector and graph can be audited.
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: competitionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[!-~]+$
          description: Printable ASCII without spaces. Scoped to this organization and competition for 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizerDrawRequest'
      responses:
        '201':
          description: The durable draw. The same successful idempotent replay also returns 201.
          headers:
            Idempotency-Replayed:
              description: Present and true only when this is the stored response to an exact retry.
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/OrganizerDraw'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
          description: >-
            idempotency_key_required, invalid_idempotency_key, invalid_request, draw_config_required,
            format_config_mismatch, invalid_seeding_policy, invalid_expected_status, invalid_best_of,
            invalid_group_count, invalid_check_in_lead, invalid_check_in_grace, invalid_result_window (outside
            15..1440, or less than checkInGraceMinutes + 15), invalid_round_interval, invalid_draw_seed.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: >-
            The state changed, the draw already exists, fewer than two active entries remain, the group count no longer
            fits the field, or the idempotency key belongs to another request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Error'
