        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: platform_access_denied.
        '500':
          $ref: '#/components/responses/Error'
          description: internal_error.
        '503':
          $ref: '#/components/responses/Error'
          description: database_unavailable.
  /v1/admin/player-strikes/{id}/revocations:
    post:
      operationId: revokePlayerStrike
      tags:
        - Platform result review
      summary: Revoke an active conduct strike (admins only).
      description: >-
        The strike stays in the feed as history but no longer counts towards the registration ban. The
        player gets an inbox notification.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerStrikeRevocationRequest'
      responses:
        '200':
          description: Strike revoked.
          headers:
            Idempotency-Replayed:
              description: Present with the value true when the stored response for this key was replayed.
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStrikeEnvelope'
        '400':
          $ref: '#/components/responses/Error'
          description: >-
            idempotency_key_required, invalid_idempotency_key; invalid_request; invalid_strike_revocation
            (reason outside 10..500 characters).
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: >-
            platform_access_denied (only admins revoke strikes); result_review_conflict (the strike is the
            admin's own, or from a match the admin plays in, captains in or organizes).
        '404':
          $ref: '#/components/responses/Error'
          description: player_strike_not_found.
        '409':
          $ref: '#/components/responses/Error'
          description: strike_already_revoked, idempotency_conflict.
        '500':
          $ref: '#/components/responses/Error'
          description: internal_error.
        '503':
          $ref: '#/components/responses/Error'
          description: database_unavailable.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OrganizationRole:
      type: string
      enum:
        - owner
        - admin
        - analyst
      description: >-
        owner manages membership and everything below it; admin runs competitions and entries; analyst
        reads only. No role decides match results.
    OrganizationPermission:
      type: string
      enum:
        - organization.read
        - organization.manage
        - member.read
        - member.manage
        - competition.read
        - competition.write
        - competition.publish
        - entry.read
        - entry.manage
    Organization:
      type: object
      required:
        - id
        - name
        - slug
        - countryCode
        - status
        - role
        - permissions
        - competitionCount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        countryCode:
          type: string
        status:
          type: string
          enum:
            - pending
            - active
            - suspended
        role:
          $ref: '#/components/schemas/OrganizationRole'
        permissions:
          type: array
          description: What the caller's role allows. Clients disable controls from this instead of hardcoding the matrix.
          items:
            $ref: '#/components/schemas/OrganizationPermission'
        competitionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    OrganizationMember:
      type: object
      required:
        - userId
        - displayName
        - countryCode
        - role
        - joinedAt
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        handle:
          type: string
          nullable: true
        countryCode:
          type: string
        role:
          $ref: '#/components/schemas/OrganizationRole'
        joinedAt:
          type: string
          format: date-time
    CompetitionStatus:
      type: string
      enum:
        - draft
        - published
        - registration_open
        - check_in
        - running
        - completed
        - cancelled
    CompetitionInput:
      type: object
      required:
        - name
        - gameId
        - format
        - maxEntries
        - registrationOpensAt
        - registrationClosesAt
        - startsAt
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          minLength: 3
          maxLength: 48
          description: Derived from the name when omitted. Unique per organization.
        description:
          type: string
          maxLength: 4000
        gameId:
          type: string
        format:
          type: string
          enum:
            - single_elimination
            - double_elimination
            - round_robin
        maxEntries:
          type: integer
          minimum: 2
          maximum: 1024
        entryFeeMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 5000000
          description: Minor units. Above zero requires KES, the only wired collection rail.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          default: KES
        prizeAmountMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 500000000
        prizeFunding:
          type: string
          enum:
            - none
            - organizer
            - sponsor
          default: none
          description: A prize above zero must name its funder. Entry fees are an administration fee and never fund prizes.
        registrationOpensAt:
          type: string
          format: date-time
        registrationClosesAt:
          type: string
          format: date-time
        checkInOpensAt:
          type: string
          format: date-time
          nullable: true
          description: Must fall between registration closing and the start time.
        startsAt:
          type: string
          format: date-time
        rules:
          type: object
          description: >-
            Immutable rules snapshot, at most 32 KiB. Changing it on a published competition increments
            rulesVersion. rules.matchVerification accepts only the keys of CompetitionMatchVerificationRules;
            anything else is refused with 400 invalid_match_verification_rules.
          properties:
            matchVerification:
              $ref: '#/components/schemas/CompetitionMatchVerificationRules'
    CompetitionPatch:
      type: object
      minProperties: 1
      description: >-
        Every field is optional; omitted fields keep their stored value. Which fields may change depends
        on the competition's status, so a syntactically valid patch can still be refused with 409 field_locked.
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          minLength: 3
          maxLength: 48
        description:
          type: string
          maxLength: 4000
        gameId:
          type: string
        format:
          type: string
          enum:
            - single_elimination
            - double_elimination
            - round_robin
        maxEntries:
          type: integer
          minimum: 2
          maximum: 1024
        entryFeeMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 5000000
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        prizeAmountMinor:
          type: integer
          format: int64
          minimum: 0
          maximum: 500000000
        prizeFunding:
          type: string
          enum:
            - none
            - organizer
            - sponsor
        registrationOpensAt:
          type: string
          format: date-time
        registrationClosesAt:
          type: string
          format: date-time
        checkInOpensAt:
          type: string
          format: date-time
          nullable: true
        startsAt:
          type: string
          format: date-time
        rules:
          type: object
          properties:
            matchVerification:
              $ref: '#/components/schemas/CompetitionMatchVerificationRules'
    OrganizerCompetition:
      type: object
      required:
        - id
        - organizationId
        - gameId
        - name
        - slug
        - format
        - status
        - maxEntries
        - entryCount
        - allowedTransitions
        - rulesVersion
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        gameId:
          type: string
        gameName:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        format:
          type: string
          enum:
            - single_elimination
            - double_elimination
            - round_robin
        status:
          $ref: '#/components/schemas/CompetitionStatus'
        maxEntries:
          type: integer
        entryCount:
          type: integer
        availableSlots:
          type: integer
        entryFeeMinor:
          type: integer
          format: int64
        feePurpose:
          type: string
          enum:
            - none
            - administration
        currency:
          type: string
        prizeAmountMinor:
          type: integer
          format: int64
        prizeFunding:
          type: string
          enum:
            - none
            - organizer
            - sponsor
        registrationOpensAt:
          type: string
          format: date-time
        registrationClosesAt:
          type: string
          format: date-time
        checkInOpensAt:
          type: string
          format: date-time
          nullable: true
        startsAt:
          type: string
          format: date-time
        rulesVersion:
          type: integer
        rules:
          type: object
        allowedTransitions:
          type: array
          description: Statuses reachable from the current one, from the domain state machine.
          items:
            $ref: '#/components/schemas/CompetitionStatus'
        matchCount:
          type: integer
          description: Zero until a bracket is generated. Running requires this to be above zero.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizerCompetitionPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizerCompetition'
        page:
          type: object
          required:
            - nextCursor
            - hasMore
          properties:
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean
    OrganizerEntry:
      type: object
      required:
        - id
        - displayName
        - status
        - createdAt
        - playerId
        - playerName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        status:
          type: string
          enum:
            - registered
            - checked_in
            - accepted
            - withdrawal_pending
            - withdrawn
            - disqualified
        seed:
          type: integer
          nullable: true
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        playerId:
          type: string
          format: uuid
        playerName:
          type: string
        handle:
          type: string
          nullable: true
        inGameName:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
        paymentStatus:
          type: string
          nullable: true
          enum:
            - initiating
            - pending
            - callback_received
            - succeeded
            - failed
            - review
    OrganizerEntryPage:
      type: object
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrganizerEntry'
        page:
          type: object
          required:
            - nextCursor
            - hasMore
          properties:
            nextCursor:
              type: string
              nullable: true
            hasMore:
              type: boolean
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
    Game:
      type: object
      required:
        - id
        - name
        - publisher
        - platforms
        - resultMode
        - officialIntegration
      properties:
        id:
          type: string
        name:
          type: string
        publisher:
          type: string
        platforms:
          type: array
          items:
            type: string
        resultMode:
          type: string
          description: >-
            participant_confirmation means the players' own blind score reports settle the result, with Gamics
            review when they still differ.
          enum:
            - participant_confirmation
            - publisher_api
            - admin_only
        officialIntegration:
          type: boolean
    AuthSession:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresInSeconds
        - player
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresInSeconds:
          type: integer
        player:
          $ref: '#/components/schemas/Player'
    Player:
      type: object
      required:
        - id
        - email
        - displayName
        - countryCode
        - status
        - onboarding
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          description: >-
            The name opponents, match rooms and public profiles show. Until the player chooses one
            (onboarding.displayName false) it is their handle, or Player when they have no handle yet. It is never
            derived from the email address.
        countryCode:
          type: string
        birthDate:
          type:
            - string
            - 'null'
          format: date
        status:
          type: string
        profile:
          oneOf:
            - $ref: '#/components/schemas/Profile'
            - type: 'null'
        onboarding:
          type: object
          required:
            - personalDetails
            - displayName
            - profile
            - gameAccount
            - complete
          properties:
            personalDetails:
              type: boolean
            displayName:
              type: boolean
              description: >-
                True once the player chose a display name with PATCH /v1/me. While false, show the display-name
                screen; the display name is still the handle.
            profile:
              type: boolean
            gameAccount:
              type: boolean
            complete:
              type: boolean
              description: >-
                All four steps are done. Until it is true, GET /v1/competitions/{id}/eligibility reports a blocking
                issue (profile_incomplete while the display name is pending) and free registration and paid entry are
                refused with 409 for the same reason: error profile_incomplete on free registration, issue.code
                profile_incomplete of competition_ineligible on paid entry. onboarding_required is the fallback when
                onboarding changed after that check or gameAccountId is not one of the player's accounts.
    ProfileInput:
      type: object
      required:
        - handle
        - bio
        - discoverable
        - analyticsConsent
        - scoutingConsent
      properties:
        handle:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.]{2,23}$
        bio:
          type: string
          maxLength: 280
        discoverable:
          type: boolean
        analyticsConsent:
          type: boolean
        scoutingConsent:
          type: boolean
    Profile:
      allOf:
        - $ref: '#/components/schemas/ProfileInput'
    GameAccountInput:
      type: object
      required:
        - gameId
        - platform
        - inGameName
      properties:
        gameId:
          type: string
        platform:
          type: string
          enum:
            - android
            - ios
        inGameName:
          type: string
          minLength: 2
          maxLength: 80
        publisherPlayerId:
          type:
            - string
            - 'null'
    GameAccount:
      allOf:
        - $ref: '#/components/schemas/GameAccountInput'
        - type: object
          required:
            - id
            - verificationStatus
            - verificationMethod
            - publisherVerified
            - createdAt
            - updatedAt
          properties:
            id:
              type: string
              format: uuid
            verificationStatus:
              type: string
              enum:
                - unverified
                - pending
                - verified
                - rejected
            verificationMethod:
              type:
                - string
                - 'null'
              enum:
                - manual_evidence
                - publisher_api
                - null
              description: How the account was verified; null while it is not verified.
            publisherVerified:
              type: boolean
              description: True only when verification came from an integrated publisher API; a Gamics evidence review remains false.
            verifiedAt:
              type:
                - string
                - 'null'
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    PaymentIntent:
      type: object
      required:
        - id
        - competitionId
        - amountMinor
        - currency
        - phoneNumber
        - status
        - registrationStatus
        - refund
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        competitionId:
          type: string
          format: uuid
        entryId:
          type:
            - string
            - 'null'
          format: uuid
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          const: KES
        phoneNumber:
          type: string
          description: Masked phone number.
        status:
          type: string
          enum:
            - initiating
            - pending
            - callback_received
            - succeeded
            - failed
            - review
          description: >-
            The collection only. succeeded means M-Pesa confirmed the money, not that the payer holds a place; read
            registrationStatus for that.
        registrationStatus:
          type: string
          enum:
            - pending
            - registered
            - refund_pending
            - refunded
            - removed
            - not_registered
          description: >-
            What the payment did for the payer's place, derived from the entry and the latest refund. pending: the
            payment is not final yet. registered: the payment holds an active entry. refund_pending: the entry will
            not play and a full refund is owed, because the payment completed after the competition was cancelled,
            the draw was made, registration ended, the places filled or the payer reached the conduct strike limit,
            or because the payer asked to withdraw; refund says where it stands. refunded: the refund was paid out.
            removed: the entry was removed from the competition after it was registered. not_registered: no place is
            held, for example after a failed payment.
        refund:
          description: The payment's latest refund, or null when none was requested.
          oneOf:
            - $ref: '#/components/schemas/PaymentRefund'
            - type: 'null'
        merchantRequestId:
          type:
            - string
            - 'null'
        checkoutRequestId:
          type:
            - string
            - 'null'
        providerReceipt:
          type:
            - string
            - 'null'
        providerResultCode:
          type:
            - string
            - 'null'
        providerResultDescription:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
    MatchParticipant:
      type: object
      required:
        - playerId
        - handle
        - displayName
        - initials
        - side
      properties:
        playerId:
          type: string
          format: uuid
        handle:
          type: string
        displayName:
          type: string
        initials:
          type: string
          minLength: 1
          maxLength: 2
        avatarUrl:
          type: string
          format: uri
        side:
          type: string
          enum:
            - home
            - away
        checkedInAt:
          type: string
          format: date-time
    FriendMatchInstruction:
      type: object
      additionalProperties: false
      required:
        - title
        - detail
      properties:
        title:
          type: string
          maxLength: 80
        detail:
          type: string
          maxLength: 300
    MatchState:
      type: string
      enum:
        - pending
        - ready
        - in_progress
        - awaiting_confirmation
        - disputed
        - completed
        - forfeit
        - cancelled
    MatchLifecycle:
      type: string
      description: >-
        The viewer's lifecycle. awaiting_resolution covers the short gap between a passed deadline and
        the worker acting on it; it offers no actions. A removed entry is shown by resultVerification.entryRemoved,
        not by a lifecycle.
      enum:
        - assigned
        - ready_for_check_in
        - checked_in
        - report_required
        - awaiting_opponent_report
        - mismatch_response_required
        - awaiting_opponent_response
        - awaiting_resolution
        - under_review
        - forfeited
        - completed
    MatchAllowedAction:
      type: string
      description: >-
        check_in maps to POST /check-ins, report_score to POST /score-reports and submit_final_score to
        POST /score-reports/final.
      enum:
        - check_in
        - report_score
        - submit_final_score
    MatchSummary:
      type: object
      required:
        - id
        - code
        - competitionId
        - competitionName
        - gameId
        - gameName
        - roundName
        - scheduledAt
        - checkInClosesAt
        - state
        - lifecycle
        - version
        - currentPlayerSide
        - home
        - away
        - allowedActions
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        competitionId:
          type: string
          format: uuid
        competitionName:
          type: string
        gameId:
          type: string
        gameName:
          type: string
        roundName:
          type: string
        scheduledAt:
          type:
            - string
            - 'null'
          format: date-time
        checkInClosesAt:
          type:
            - string
            - 'null'
          format: date-time
        state:
          $ref: '#/components/schemas/MatchState'
        lifecycle:
          $ref: '#/components/schemas/MatchLifecycle'
        version:
          type: integer
          minimum: 1
        currentPlayerSide:
          type: string
          enum:
            - home
            - away
        home:
          oneOf:
            - $ref: '#/components/schemas/MatchParticipant'
            - type: 'null'
        away:
          oneOf:
            - $ref: '#/components/schemas/MatchParticipant'
            - type: 'null'
        allowedActions:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MatchAllowedAction'
    MatchRoom:
      allOf:
        - $ref: '#/components/schemas/MatchSummary'
        - type: object
          required:
            - stageId
            - stageName
            - roundNumber
            - matchNumber
            - bracket
            - bestOf
            - drawAllowed
            - checkInOpensAt
            - resultDueAt
            - state
            - completedAt
            - currentPlayerId
            - friendMatchInstructions
            - completionReason
            - verificationPolicy
            - resultVerification
            - result
          properties:
            stageId:
              type: string
              format: uuid
            stageName:
              type: string
            roundNumber:
              type: integer
              minimum: 1
            matchNumber:
              type: integer
              minimum: 1
            bracket:
              type: string
            bestOf:
              type: integer
              minimum: 1
            drawAllowed:
              type: boolean
            checkInOpensAt:
              type:
                - string
                - 'null'
              format: date-time
            resultDueAt:
              type:
                - string
                - 'null'
              format: date-time
            completedAt:
              type:
                - string
                - 'null'
              format: date-time
            currentPlayerId:
              type: string
              format: uuid
            friendMatchInstructions:
              type: array
              items:
                $ref: '#/components/schemas/FriendMatchInstruction'
            completionReason:
              $ref: '#/components/schemas/MatchCompletionReason'
            verificationPolicy:
              $ref: '#/components/schemas/MatchVerificationPolicy'
            resultVerification:
              $ref: '#/components/schemas/ResultVerification'
            result:
              description: The canonical score; non-null only when state is completed.
              oneOf:
                - $ref: '#/components/schemas/MatchConfirmedResult'
                - type: 'null'
      description: >-
        The viewer's blind match room. Never contains the opponent's score before the match is resolved;
        after resolution only the canonical result is shown.
    MatchRoomResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MatchRoom'
    ScoreReportRequest:
      type: object
      additionalProperties: false
      description: One entry's blind score claim. Only the server compares it with the other entry's claim.
      required:
        - homeScore
        - awayScore
        - declarationAccepted
      properties:
        homeScore:
          type: integer
          minimum: 0
          maximum: 99
        awayScore:
          type: integer
          minimum: 0
          maximum: 99
        games:
          type: array
          maxItems: 99
          description: >-
            Optional game-by-game breakdown: 1..bestOf games whose totals equal homeScore and awayScore.
            When omitted, the server records one aggregate game. It never decides whether two claims agree.
          items:
            $ref: '#/components/schemas/GameScore'
        tiebreak:
          description: >-
            Required for a tied elimination match (a penalty shootout with a winner); forbidden otherwise.
            Round-robin draws have no tiebreak.
          oneOf:
            - $ref: '#/components/schemas/TiebreakScore'
            - type: 'null'
        declarationAccepted:
          type: boolean
          const: true
    FinalScoreReportRequest:
      type: object
      additionalProperties: false
      description: >-
        One entry's single response to a mismatch. Same score rules as ScoreReportRequest, plus the screenshots
        that prove it.
      required:
        - homeScore
        - awayScore
        - evidenceIds
        - declarationAccepted
      properties:
        homeScore:
          type: integer
          minimum: 0
          maximum: 99
        awayScore:
          type: integer
          minimum: 0
          maximum: 99
        games:
          type: array
          maxItems: 99
          items:
            $ref: '#/components/schemas/GameScore'
        tiebreak:
          oneOf:
            - $ref: '#/components/schemas/TiebreakScore'
            - type: 'null'
        evidenceIds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          description: >-
            The caller's own processed (ready=true) JPEG or PNG uploads that are not attached to anything
            else.
          items:
            type: string
            format: uuid
        declarationAccepted:
          type: boolean
          const: true
    ScoreReportView:
      type: object
      additionalProperties: false
      description: >-
        One of the viewer's own reports. There is no view of the other entry's report: this schema never
        contains the opponent's score before the match is resolved, or after.
      required:
        - id
        - kind
        - homeScore
        - awayScore
        - tiebreak
        - games
        - reportedAt
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - initial
            - final
        homeScore:
          type: integer
          minimum: 0
          maximum: 99
        awayScore:
          type: integer
          minimum: 0
          maximum: 99
        tiebreak:
          oneOf:
            - $ref: '#/components/schemas/TiebreakScore'
            - type: 'null'
        games:
          type: array
          items:
            $ref: '#/components/schemas/GameScore'
        evidenceIds:
          type: array
          description: Present only on a final report, in the order they were submitted.
          items:
            type: string
            format: uuid
        reportedAt:
          type: string
          format: date-time
    ScoreReportResponseEnvelope:
      type: object
      additionalProperties: false
      description: The caller's own room and report. Never contains the opponent's score before the match is resolved.
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - match
            - report
          properties:
            match:
              $ref: '#/components/schemas/MatchRoom'
            report:
              $ref: '#/components/schemas/ScoreReportView'
    ResultVerification:
      type: object
      additionalProperties: false
      description: >-
        The viewer's blind view of result verification. Never contains the opponent's score before the
        match is resolved: about the other entry it says only whether it reported or responded. Each deadline
        is shown only in the phase it governs.
      required:
        - phase
        - myReport
        - myFinalReport
        - opponentReported
        - opponentResponded
        - reportDeadline
        - responseDeadline
        - resolution
        - entryRemoved
      properties:
        phase:
          type: string
          enum:
            - not_started
            - awaiting_second_report
            - awaiting_responses
            - in_review
            - resolved
          description: >-
            not_started until the first report. A resolved match may also stay not_started when nobody
            ever reported.
        myReport:
          oneOf:
            - $ref: '#/components/schemas/ScoreReportView'
            - type: 'null'
        myFinalReport:
          oneOf:
            - $ref: '#/components/schemas/ScoreReportView'
            - type: 'null'
        opponentReported:
          type: boolean
        opponentResponded:
          type: boolean
        reportDeadline:
          type:
            - string
            - 'null'
          format: date-time
          description: End of the second entry's report window; set only in awaiting_second_report.
        responseDeadline:
          type:
            - string
            - 'null'
          format: date-time
          description: End of the mismatch response window; set only in awaiting_responses.
        resolution:
          type:
            - string
            - 'null'
          enum:
            - agreed
            - report_timeout
            - response_timeout
            - platform_review
            - competition_cancelled
            - null
        entryRemoved:
          type: boolean
          description: True once the viewer's entry has been removed (disqualified) from the tournament.
    MatchConfirmedResult:
      type: object
      additionalProperties: false
      description: The canonical score, present only when the match state is completed.
      required:
        - homeScore
        - awayScore
        - tiebreak
        - origin
        - confirmedAt
      properties:
        homeScore:
          type: integer
          minimum: 0
          maximum: 99
        awayScore:
          type: integer
          minimum: 0
          maximum: 99
        tiebreak:
          oneOf:
            - $ref: '#/components/schemas/TiebreakScore'
            - type: 'null'
        origin:
          type: string
          enum:
            - agreed_reports
            - platform_review
            - legacy
          description: >-
            agreed_reports when both entries' claims matched; platform_review when Gamics decided; legacy
            for results confirmed before result verification v2.
        confirmedAt:
          type: string
          format: date-time
    MatchCompletionReason:
      type:
        - string
        - 'null'
      description: >-
        Why a terminal match ended. report_timeout, response_timeout and no_result_reported remove the
        silent entries from the tournament; platform_review is a Gamics review decision; competition_cancelled
        is set when the competition is cancelled. referee is a legacy history value that is never written
        any more.
      enum:
        - played
        - walkover
        - double_no_show
        - timeout_forfeit
        - reset_not_required
        - correction_voided
        - report_timeout
        - response_timeout
        - no_result_reported
        - platform_review
        - competition_cancelled
        - referee
        - null
    CursorPage:
      type: object
