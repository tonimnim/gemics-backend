worker_processes auto;
events { worker_connections 4096; }
http {
  access_log off;
  upstream gamics_api {
    server api:8080;
    keepalive 64;
  }
  server {
    # Burst headroom at the Linux listener. This does not remove limits in
    # Docker Desktop's Windows host-port forwarding path.
    listen 8080 backlog=4096;
    client_max_body_size 1m;
    location / {
      proxy_pass http://gamics_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 35s;
      proxy_send_timeout 20s;
      # Do not invisibly retry mutations on a different API replica.
      proxy_next_upstream off;
    }
  }
}
