name: gamics

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=256MB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gamics_postgres:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

  postgres-replication-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-development-replication-secret}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/init-replication.sh:/scripts/init-replication.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-replication.sh"]

  postgres-replica:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PRIMARY_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_REPLICATION_USER: gamics_replica
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-development-replication-secret}
      PGPASSFILE: /var/lib/postgresql/.pgpass
    ports:
      - "${POSTGRES_REPLICA_PORT:-5433}:5432"
    depends_on:
      postgres-replication-init:
        condition: service_completed_successfully
    volumes:
      - gamics_postgres_replica:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/scripts/replica-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && test \"$$(psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT pg_is_in_recovery()')\" = t"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-redis-secret}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - gamics_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        VERSION: ${GAMICS_VERSION:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_WRITE_URL: ${DATABASE_WRITE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
      DATABASE_READ_URL: ${DATABASE_READ_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB}?sslmode=disable}
      DATABASE_WRITE_MAX_CONNS: ${DATABASE_WRITE_MAX_CONNS:-8}
      DATABASE_READ_MAX_CONNS: ${DATABASE_READ_MAX_CONNS:-16}
      DATABASE_MAX_REPLICA_LAG: ${DATABASE_MAX_REPLICA_LAG:-5s}
      DATABASE_FALLBACK_MAX_CONCURRENCY: ${DATABASE_FALLBACK_MAX_CONCURRENCY:-16}
      REDIS_URL: redis://:${REDIS_PASSWORD:-development-redis-secret}@redis:6379/0
      REDIS_SECURITY_URL: ${REDIS_SECURITY_URL:-redis://:${REDIS_PASSWORD:-development-redis-secret}@redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD:-development-redis-secret}@redis:6379/0}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-gamics:development:v1}
      GAME_CATALOG_CACHE_TTL: ${GAME_CATALOG_CACHE_TTL:-12h}
      AUTH_SESSION_CACHE_TTL: ${AUTH_SESSION_CACHE_TTL:-30s}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-development-only-auth-token-secret-change-me}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-development-only-otp-hash-secret-change-me}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      OTP_TTL: ${OTP_TTL:-10m}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_REQUEST_WINDOW: ${OTP_REQUEST_WINDOW:-15m}
      OTP_EMAIL_LIMIT: ${OTP_EMAIL_LIMIT:-5}
      OTP_IP_LIMIT: ${OTP_IP_LIMIT:-20}
      EMAIL_MODE: ${EMAIL_MODE:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-disabled}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORT_CODE: ${MPESA_SHORT_CODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_BASE_URL: ${MPESA_CALLBACK_BASE_URL:-}
      MPESA_CALLBACK_TOKEN: ${MPESA_CALLBACK_TOKEN:-}
      MPESA_TRANSACTION_TYPE: ${MPESA_TRANSACTION_TYPE:-CustomerPayBillOnline}
      MPESA_TIMEOUT: ${MPESA_TIMEOUT:-15s}
      MPESA_MAX_AMOUNT_MINOR: ${MPESA_MAX_AMOUNT_MINOR:-1000000}
      MPESA_USER_LIMIT: ${MPESA_USER_LIMIT:-5}
      MPESA_PHONE_LIMIT: ${MPESA_PHONE_LIMIT:-8}
      MPESA_IP_LIMIT: ${MPESA_IP_LIMIT:-20}
      MPESA_USER_WINDOW: ${MPESA_USER_WINDOW:-15m}
      MPESA_PHONE_WINDOW: ${MPESA_PHONE_WINDOW:-1h}
      MPESA_IP_WINDOW: ${MPESA_IP_WINDOW:-1h}
      STORAGE_MODE: ${STORAGE_MODE:-disabled}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-af-south-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_SESSION_TOKEN: ${STORAGE_S3_SESSION_TOKEN:-}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-true}
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-10m}
      STORAGE_HTTP_TIMEOUT: ${STORAGE_HTTP_TIMEOUT:-10s}
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-10485760}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SHUTDOWN_TIMEOUT: 10s
      REQUEST_TIMEOUT: 15s
      READ_HEADER_TIMEOUT: 5s
      READ_TIMEOUT: 15s
      WRITE_TIMEOUT: 30s
      IDLE_TIMEOUT: 90s
      MAX_HEADER_BYTES: 32768
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  gamics_postgres:
  gamics_postgres_replica:
  gamics_redis:
