paths:
  /v1/competitions:
    get:
      operationId: listCompetitions
      tags: [Competitions]
      summary: Discover public competitions with bounded keyset pagination.
      parameters:
        - { name: gameId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [published, registration_open, check_in, running, completed] } }
        - { name: entryType, in: query, schema: { type: string, enum: [free, paid] } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200":
          description: Public competition page.
          content: { application/json: { schema: { $ref: "#/components/schemas/CompetitionPage" } } }
        "400": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/competitions/{id}:
    get:
      operationId: getCompetition
      tags: [Competitions]
      description: >-
        A cancelled competition stays readable here with status cancelled, so its entrants' registrations and the
        competition.cancelled push keep resolving, but it leaves GET /v1/competitions. A draft, including one
        cancelled before it was published, returns 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Public competition detail and immutable rules snapshot.
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CompetitionDetail" } } } } }
        "404":
          $ref: "#/components/responses/Error"
          description: >-
            competition_not_found (missing, a draft, cancelled before it was published, or of an inactive game or
            organizer).
        "503": { $ref: "#/components/responses/Error" }
  /v1/competitions/{id}/bracket:
    get:
      operationId: getCompetitionBracket
      tags: [Competitions]
      description: >-
        Readable for exactly the competitions GET /v1/competitions/{id} returns. A cancelled competition keeps its
        bracket: every match still live at the cancellation reads state cancelled with completionReason
        competition_cancelled, and a competition cancelled before its draw has no stages.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Generated stages and matches. This endpoint never generates a bracket.
          content: { application/json: { schema: { $ref: "#/components/schemas/BracketResponse" } } }
        "404":
          $ref: "#/components/responses/Error"
          description: >-
            competition_not_found (missing, a draft, cancelled before it was published, or of an inactive game or
            organizer).
        "503": { $ref: "#/components/responses/Error" }
  /v1/competitions/{id}/registrations:
    post:
      operationId: createFreeRegistration
      tags: [Registrations]
      description: >-
        A competition GET /v1/competitions/{id} does not return answers 404 competition_not_found. A cancelled
        competition is refused with 409 competition_ineligible whose issue.code is competition_cancelled, the first
        issue of any entry to it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [gameAccountId], properties: { gameAccountId: { type: string, format: uuid } } } } }
      responses:
        "200":
          description: The player already holds this registration; the existing entry is returned.
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Registration" } } } } }
        "201":
          description: Free registration created atomically.
          content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Registration" } } } } }
        "400":
          $ref: "#/components/responses/Error"
          description: >-
            idempotency_key_required; invalid_request (malformed body or unknown field); invalid_game_account
            (gameAccountId is not a UUID).
        "401":
          $ref: "#/components/responses/Error"
          description: authentication_required, invalid_access_token, invalid_session.
        "404":
          $ref: "#/components/responses/Error"
          description: competition_not_found (unknown, or not open to players).
        "409":
          description: >-
            competition_ineligible (CompetitionIneligibleError: the blocking issue the eligibility preflight reports,
            the same body M-Pesa checkout returns); payment_required (PaymentRequiredError: the competition is paid,
            use POST /v1/payments/mpesa/stk-push); idempotency_conflict (the key was used for a different request).
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: "#/components/schemas/CompetitionIneligibleError" }
                  - { $ref: "#/components/schemas/PaymentRequiredError" }
                  - { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/Error"
          description: database_unavailable, session_check_unavailable, eligibility_policy_invalid, eligibility_unavailable.
  /v1/me/registrations:
    get:
      operationId: listMyRegistrations
      tags: [Registrations]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 2048 } }
      responses:
        "200":
          description: Signed-in player's registrations.
          content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationPage" } } }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/competitions/{id}/registrations/me:
    delete:
      operationId: withdrawRegistration
      tags: [Registrations]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Free registration withdrawn. }
        "401":
          $ref: "#/components/responses/Error"
          description: authentication_required, invalid_access_token, invalid_session.
        "404":
          $ref: "#/components/responses/Error"
          description: registration_not_found (the caller has no entry, or the id is malformed).
        "409":
          $ref: "#/components/responses/Error"
          description: >-
            refund_review_required (a paid entry; use POST /v1/competitions/{id}/registrations/me/withdrawal-requests);
            withdrawal_closed (the entry is checked in or removed, or registration has closed).
        "503":
          $ref: "#/components/responses/Error"
          description: database_unavailable, session_check_unavailable.
components:
  schemas:
    Competition:
      type: object
      required: [id, slug, name, gameId, gameName, organizerId, organizerName, format, status, maxEntries, entryCount, availableSlots, entryType, entryFeeMinor, currency, startsAt]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        gameId: { type: string }
        gameName: { type: string }
        organizerId: { type: string, format: uuid }
        organizerName: { type: string }
        organizerSlug: { type: string }
        format: { type: string, enum: [single_elimination, double_elimination, round_robin] }
        status:
          type: string
          description: >-
            cancelled is returned only when a competition is read by id: a cancelled competition leaves GET
            /v1/competitions, but its detail and bracket stay readable.
          enum: [published, registration_open, check_in, running, completed, cancelled]
        maxEntries: { type: integer, minimum: 2 }
        entryCount: { type: integer, minimum: 0 }
        availableSlots: { type: integer, minimum: 0 }
        entryType: { type: string, enum: [free, paid] }
        entryFeeMinor: { type: integer, format: int64, minimum: 0 }
        feePurpose: { type: string, enum: [none, administration] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        prizeAmountMinor: { type: integer, format: int64, minimum: 0 }
        prizeFunding: { type: string, enum: [none, organizer, sponsor] }
        registrationOpensAt: { type: string, format: date-time }
        registrationClosesAt: { type: string, format: date-time }
        checkInOpensAt: { type: [string, "null"], format: date-time }
        startsAt: { type: string, format: date-time }
        rulesVersion: { type: integer, minimum: 1 }
    CompetitionDetail:
      allOf:
        - { $ref: "#/components/schemas/Competition" }
        - { type: object, required: [rules], properties: { rules: { type: object, additionalProperties: true } } }
    CompetitionPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Competition" } }
        page: { $ref: "#/components/schemas/CursorPage" }
    Registration:
      type: object
      required: [id, competitionId, competitionName, gameId, gameName, displayName, gameAccountId, status, entryFeeMinor, currency, startsAt, createdAt, competitionStatus]
      properties:
        id: { type: string, format: uuid }
        competitionId: { type: string, format: uuid }
        competitionName: { type: string }
        competitionSlug: { type: string }
        gameId: { type: string }
        gameName: { type: string }
        displayName: { type: string }
        gameAccountId: { type: string, format: uuid }
        status: { type: string, enum: [registered, checked_in, accepted, withdrawal_pending, withdrawn, disqualified] }
        entryFeeMinor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string }
        startsAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        competitionStatus:
          type: string
          description: >-
            The competition's current status. Cancelling a competition leaves its free entries registered (paid
            entries move to withdrawal_pending for their refund), so show the entry as cancelled whenever this is
            cancelled.
          enum: [published, registration_open, check_in, running, completed, cancelled]
    RegistrationPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Registration" } }
        page: { $ref: "#/components/schemas/CursorPage" }
    CompetitionIneligibleError:
      type: object
      description: >-
        409 competition_ineligible, the one body free registration and M-Pesa checkout use for a blocked entry.
        issue is the blocking issue, with the code, category and message the eligibility preflight uses (for
        example conduct_suspended, registration_closed or competition_full); eligibility is the decision taken in
        the write transaction. Switch on issue.code and show message.
      required: [error, message, issue, eligibility]
      properties:
        error: { type: string, const: competition_ineligible }
        message: { type: string, description: "The blocking issue's message, ready to show." }
        issue: { $ref: "#/components/schemas/CompetitionEligibilityIssue" }
        eligibility: { $ref: "#/components/schemas/CompetitionEligibility" }
    PaymentRequiredError:
      type: object
      description: 409 payment_required from free registration of a paid competition.
      required: [error, message, nextAction]
      properties:
        error: { type: string, const: payment_required }
        message: { type: string }
        nextAction: { type: string, const: POST /v1/payments/mpesa/stk-push }
    BracketResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [competitionId, stages]
          properties:
            competitionId: { type: string, format: uuid }
            stages: { type: array, items: { type: object, additionalProperties: true } }
