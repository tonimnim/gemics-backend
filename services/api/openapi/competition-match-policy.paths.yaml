# Merge fragment for the player eligibility, typed bracket and match-verification
# slice. openapi.yaml remains the generated/assembled source of truth; this file
# deliberately does not duplicate unrelated operations. The blind score-report
# operations and the room's resultVerification schemas live in
# match-score-reports.paths.yaml.
paths:
  /v1/competitions/{id}/eligibility:
    get:
      operationId: getCompetitionEligibility
      tags: [Competitions]
      summary: Evaluate every current registration requirement for the signed-in player.
      description: >-
        This is a private writer-side decision and must not be shared-cached. A paid
        competition can be eligible while canRegisterNow is false and requiredAction
        is start_payment. Registration/payment handlers must evaluate the same policy
        again in their write transaction because capacity and deadlines can change.
        A cancelled competition answers 200 with the blocking issue competition_cancelled, while a player who is
        already entered keeps status registered; 404 is returned only where GET /v1/competitions/{id} returns it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: gameAccountId
          in: query
          required: false
          description: Omit to discover that selecting a connected account is required.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A complete eligibility decision, including every blocking/action issue.
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetitionEligibilityResponse" }
        "400":
          $ref: "#/components/responses/Error"
          description: invalid_game_account (gameAccountId is not a UUID).
        "401":
          $ref: "#/components/responses/Error"
          description: authentication_required, invalid_access_token, invalid_session.
        "404":
          $ref: "#/components/responses/Error"
          description: competition_not_found (unknown, or not open to players).
        "503":
          $ref: "#/components/responses/Error"
          description: database_unavailable, session_check_unavailable, eligibility_policy_invalid, eligibility_unavailable.
  /v1/competitions/{id}/bracket:
    get:
      operationId: getCompetitionBracket
      tags: [Competitions]
      summary: Return the generated bracket as typed stages, rounds, matches and graph edges.
      description: >-
        Readable for exactly the competitions GET /v1/competitions/{id} returns. A cancelled competition keeps its
        bracket: every match still live at the cancellation reads state cancelled with completionReason
        competition_cancelled, and a competition cancelled before its draw has no stages.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Read-only bracket projection. This operation never generates a draw.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TypedBracketResponse" }
        "404":
          $ref: "#/components/responses/Error"
          description: >-
            competition_not_found (missing, a draft, cancelled before it was published, or of an inactive game or
            organizer).
        "503": { $ref: "#/components/responses/Error" }
  /v1/competitions/{id}/standings:
    get:
      operationId: getCompetitionStandings
      tags: [Competitions]
      summary: Return the round-robin tables and the final placements.
      description: >-
        Readable for exactly the competitions the bracket is, cancelled ones included. stages holds one table per
        round-robin group, ranked by points (3 for a win, walkovers included, 1 for a draw), then goal difference,
        then goals scored; rows level on all three share a rank (1, 1, 3). A removed entry keeps the results it
        already played but is unranked (rank null, removed true) and listed after the ranked rows, and the table
        re-ranks around it, exactly as its final placement is decided. placements is empty until the stage
        completes, then lists the final placements for every format, written once in the same transaction as the
        last result. The response is cached for about two seconds and refreshed after every result.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Round-robin tables and final placements. A knockout competition has no stages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompetitionStandingsResponse" }
        "404":
          $ref: "#/components/responses/Error"
          description: competition_not_found (missing, a draft, or cancelled before it was published).
        "503":
          $ref: "#/components/responses/Error"
          description: standings_unavailable or database_unavailable; retry with backoff.
  /v1/matches/{matchId}:
    get:
      operationId: getMatch
      tags: [Matches]
      summary: Return a participant match room with an explicit verification policy.
      description: >-
        The room is the caller's blind view. It never contains the opponent's score before the match
        is resolved: resultVerification says only whether the opponent reported or responded, and the
        canonical result appears once the match is completed.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized participant match room.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchRoomWithVerificationResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "404":
          $ref: "#/components/responses/Error"
          description: match_not_found (missing, or the caller is not a starter or substitute of either entry).
        "503": { $ref: "#/components/responses/Error" }

components:
  schemas:
    CompetitionEligibilityResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/CompetitionEligibility" }
    CompetitionEligibility:
      type: object
      additionalProperties: false
      required:
        - competitionId
        - gameId
        - status
        - eligible
        - canRegisterNow
        - requiredAction
        - entryFeeMinor
        - currency
        - requirements
        - issues
        - paymentId
        - evaluatedAt
      properties:
        competitionId: { type: string, format: uuid }
        gameId: { type: string }
        status: { type: string, enum: [eligible, ineligible, registered] }
        eligible:
          type: boolean
          description: False only when at least one blocking issue exists.
        canRegisterNow:
          type: boolean
          description: True only for a free, eligible competition ready for the registration POST.
        requiredAction:
          type: string
          enum: [none, submit_registration, start_payment, poll_payment, view_registration, view_refund]
        entryFeeMinor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        requirements: { $ref: "#/components/schemas/CompetitionEligibilityRequirements" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/CompetitionEligibilityIssue" }
        paymentId:
          type: [string, "null"]
          format: uuid
          description: >-
            The player's latest payment for this competition, or null. Whenever it is not null, read it with
            GET /v1/payments/{id} and act on its status and registrationStatus, whatever requiredAction says; that
            payment also carries the refund when requiredAction is view_refund. requiredAction is poll_payment while
            the payment is unfinished (initiating, pending, callback_received or review), even when a blocking
            issue such as registration_closed or competition_full stops a new entry.
        evaluatedAt: { type: string, format: date-time }
    CompetitionEligibilityRequirements:
      type: object
      additionalProperties: false
      required: [minimumAge, allowedCountries, minimumRating, maximumRank, requireVerifiedGameAccount]
      properties:
        minimumAge: { type: [integer, "null"], minimum: 0, maximum: 100 }
        allowedCountries:
          type: array
          maxItems: 64
          uniqueItems: true
          items: { type: string, pattern: "^[A-Z]{2}$" }
        minimumRating: { type: [integer, "null"], minimum: 0, maximum: 10000 }
        maximumRank: { type: [integer, "null"], minimum: 1 }
        rankingScope: { type: string, enum: [global, country] }
        requireVerifiedGameAccount: { type: boolean }
    CompetitionEligibilityIssue:
      type: object
      additionalProperties: false
      required: [code, category, severity, message]
      properties:
        code:
          type: string
          enum:
            - profile_incomplete
            - registration_not_reusable
            - registration_not_open
            - registration_closed
            - competition_full
            - age_required
            - minimum_age_not_met
            - country_not_allowed
            - rating_unavailable
            - minimum_rating_not_met
            - ranking_unavailable
            - maximum_rank_not_met
            - game_account_required
            - game_account_game_mismatch
            - verified_game_account_required
            - payment_required
            - payment_pending
            - payment_processing
            - payment_retry_required
            - conduct_suspended
            - competition_cancelled
          description: >-
            profile_incomplete means onboarding is unfinished (see Player.onboarding), including a pending display name.
            conduct_suspended blocks new registrations while the player holds at least the platform's
            active conduct strike threshold (3 by default). Existing entries are unaffected.
            competition_cancelled (category registration) blocks every new entry once the competition is cancelled
            and is listed before any other issue. registration_not_open means registration has not opened yet;
            registration_closed means its deadline passed or the competition is in check-in, running or completed.
        category:
          type: string
          enum: [profile, registration, capacity, age, country, ranking, game_account, payment, conduct]
        severity: { type: string, enum: [blocking, action_required] }
        message: { type: string }
    MatchVerificationPolicy:
      type: object
      additionalProperties: false
      description: >-
        The windows of the blind dual score report. They are snapshotted when the first report opens
        verification, so a later rules edit never moves a live deadline; before that they are resolved
        from the competition's matchVerification rules.
      required: [reportWindowSeconds, reminderBeforeDeadlineSeconds, responseWindowSeconds, finalReportEvidence]
      properties:
        reportWindowSeconds:
          type: integer
          format: int64
          minimum: 300
          maximum: 3600
          description: How long the other entry has to report after the first report (10 minutes by default).
        reminderBeforeDeadlineSeconds:
          type: integer
          format: int64
          minimum: 60
          description: When the reminder push reaches a silent entry, before the report window ends (3 minutes by default). Always less than reportWindowSeconds.
        responseWindowSeconds:
          type: integer
          format: int64
          minimum: 300
          maximum: 3600
          description: How long each entry has to submit its final score after a mismatch (10 minutes by default).
        finalReportEvidence:
          type: object
          additionalProperties: false
          required: [minItems, maxItems, mediaTypes]
          properties:
            minItems: { type: integer, const: 1 }
            maxItems: { type: integer, const: 3 }
            mediaTypes:
              type: array
              items: { type: string, enum: [image/jpeg, image/png] }
    CompetitionMatchVerificationRules:
      type: object
      additionalProperties: false
      description: >-
        rules.matchVerification on a competition. Every field is optional and whole minutes. Writes reject
        any other key, including the retired evidenceRequirement, confirmationWindowMinutes,
        autoConfirmEnabled and refereeMonitoring, with 400 invalid_match_verification_rules. Stored
        values outside the bounds are ignored on read and the defaults apply.
      properties:
        reportWindowMinutes: { type: integer, minimum: 5, maximum: 60, default: 10 }
        reminderBeforeDeadlineMinutes: { type: integer, minimum: 1, default: 3, description: Must be less than the report window. }
        responseWindowMinutes: { type: integer, minimum: 5, maximum: 60, default: 10 }
    MatchRoomWithVerificationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          allOf:
            - { $ref: "#/components/schemas/MatchRoom" }
            - type: object
              required: [verificationPolicy]
              properties:
                verificationPolicy: { $ref: "#/components/schemas/MatchVerificationPolicy" }
    TypedBracketResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [competitionId, stages]
          properties:
            competitionId: { type: string, format: uuid }
            stages:
              type: array
              items: { $ref: "#/components/schemas/BracketStage" }
    BracketStage:
      type: object
      additionalProperties: false
      required: [id, name, position, format, bestOf, status, rounds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer, minimum: 0 }
        format: { type: string, enum: [single_elimination, double_elimination, round_robin] }
        bestOf: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, active, completed] }
        rounds:
          type: array
          items: { $ref: "#/components/schemas/BracketRound" }
    BracketRound:
      type: object
      additionalProperties: false
      required: [number, name, bracket, matches]
      properties:
        number: { type: integer, minimum: 1 }
        name: { type: string }
        bracket: { type: string }
        matches:
          type: array
          items: { $ref: "#/components/schemas/BracketMatch" }
    BracketMatch:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - matchNumber
        - state
        - home
        - away
        - score
        - winnerEntryId
        - scheduledAt
        - resultDueAt
        - completedAt
        - progression
        - version
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        matchNumber: { type: integer, minimum: 1 }
        state: { $ref: "#/components/schemas/MatchState" }
        home: { $ref: "#/components/schemas/BracketSlot" }
        away: { $ref: "#/components/schemas/BracketSlot" }
        score:
          oneOf:
            - { $ref: "#/components/schemas/BracketScore" }
            - { type: "null" }
        winnerEntryId: { type: [string, "null"], format: uuid }
        scheduledAt: { type: [string, "null"], format: date-time }
        resultDueAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        progression: { $ref: "#/components/schemas/BracketProgression" }
        version: { type: integer, minimum: 1 }
    BracketSlot:
      type: object
      additionalProperties: false
      required: [side, participant, source]
      properties:
        side: { type: string, enum: [home, away] }
        participant:
          oneOf:
            - { $ref: "#/components/schemas/BracketParticipant" }
            - { type: "null" }
        source:
          oneOf:
            - { $ref: "#/components/schemas/BracketSlotSource" }
            - { type: "null" }
    BracketParticipant:
      type: object
      additionalProperties: false
      required: [entryId, displayName, seed]
      properties:
        entryId: { type: string, format: uuid }
        displayName: { type: string }
        seed: { type: [integer, "null"], minimum: 1 }
    BracketSlotSource:
      type: object
      additionalProperties: false
      required: [kind, entryId, matchId, sourceGraphRank, resolvedEntryId, resolvedAt, voidedAt]
      properties:
        kind: { type: string, enum: [entry, winner_of, loser_of] }
        entryId: { type: [string, "null"], format: uuid }
        matchId: { type: [string, "null"], format: uuid }
        sourceGraphRank: { type: [integer, "null"], minimum: 1 }
        resolvedEntryId: { type: [string, "null"], format: uuid }
        resolvedAt: { type: [string, "null"], format: date-time }
        voidedAt: { type: [string, "null"], format: date-time }
    BracketScore:
      type: object
      additionalProperties: false
      required: [submissionId, homeScore, awayScore, tiebreak, confirmedAt]
      properties:
        submissionId: { type: string, format: uuid }
        homeScore: { type: integer, minimum: 0, maximum: 99 }
        awayScore: { type: integer, minimum: 0, maximum: 99 }
        tiebreak:
          oneOf:
            - { $ref: "#/components/schemas/TiebreakScore" }
            - { type: "null" }
        confirmedAt: { type: string, format: date-time }
    BracketProgression:
      type: object
      additionalProperties: false
      required: [graphRank, activationRule, activationSourceMatchId, completionReason]
      properties:
        graphRank: { type: integer, minimum: 1 }
        activationRule: { type: string, enum: [unconditional, if_source_away_wins] }
        activationSourceMatchId: { type: [string, "null"], format: uuid }
        completionReason:
          type: [string, "null"]
          description: See MatchCompletionReason. referee is a legacy history value that is never written any more.
          enum:
            - played
            - walkover
            - double_no_show
            - timeout_forfeit
            - reset_not_required
            - correction_voided
            - report_timeout
            - response_timeout
            - no_result_reported
            - platform_review
            - competition_cancelled
            - referee
            - null
    CompetitionStandingsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/CompetitionStandings" }
    CompetitionStandings:
      type: object
      additionalProperties: false
      required: [competitionId, stages, placements]
      properties:
        competitionId: { type: string, format: uuid }
        stages:
          type: array
          description: >-
            One entry per round-robin stage, in stage order. Empty for a knockout competition and before the draw.
          items: { $ref: "#/components/schemas/StandingsStage" }
        placements:
          type: array
          description: >-
            Final placements ordered by placement, then entryId. Empty until the stage completes; then written once,
            for every format. Tied entries share a placement. A removed entry has no placement, and nobody is
            promoted into its place in a knockout. A cancelled competition has none. A stage with groups is placed
            as one table across all its groups, by the same order, so an entry's placement can differ from its
            rank in its group table.
          items: { $ref: "#/components/schemas/CompetitionPlacement" }
    StandingsStage:
      type: object
      additionalProperties: false
      required: [id, name, position, status, groups]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer, minimum: 0 }
        status:
          type: string
          description: The stage's own status; completed once its last result is in and the placements are written.
          enum: [pending, active, completed]
        groups:
          type: array
          items: { $ref: "#/components/schemas/StandingsGroup" }
    StandingsGroup:
      type: object
      additionalProperties: false
      required: [key, rows]
      properties:
        key:
          type: string
          description: >-
            main for a single table, otherwise group_a, group_b and so on: the bracket value of the group's rounds
            in the bracket response.
        rows:
          type: array
          description: The ranked rows in table order, then the removed rows in the same order.
          items: { $ref: "#/components/schemas/StandingRow" }
    StandingRow:
      type: object
      additionalProperties: false
      required:
        - rank
        - entryId
        - displayName
        - played
        - wins
        - draws
        - losses
        - goalsFor
        - goalsAgainst
        - goalDifference
        - points
        - walkovers
        - removed
      properties:
        rank:
          type: [integer, "null"]
          minimum: 1
          description: >-
            Competition rank within the group; entries level on points, goal difference and goals scored share it.
            null exactly when removed is true.
        entryId: { type: string, format: uuid }
        displayName: { type: string }
        played: { type: integer, minimum: 0 }
        wins: { type: integer, minimum: 0 }
        draws: { type: integer, minimum: 0 }
        losses: { type: integer, minimum: 0 }
        goalsFor: { type: integer, minimum: 0 }
        goalsAgainst: { type: integer, minimum: 0 }
        goalDifference: { type: integer }
        points: { type: integer, minimum: 0 }
        walkovers:
          type: integer
          minimum: 0
          description: Wins by forfeit, already counted in wins and points.
        removed:
          type: boolean
          description: >-
            The entry was disqualified or withdrew after the draw. Its played results stand but it is unranked and
            receives no placement. On a cancelled competition only a disqualification counts: cancelling moves paid
            entries to withdrawal_pending solely to refund them.
    CompetitionPlacement:
      type: object
      additionalProperties: false
      required: [placement, entryId, displayName]
      properties:
        placement: { type: integer, minimum: 1 }
        entryId: { type: string, format: uuid }
        displayName: { type: string }
