  /v1/competitions/{id}/eligibility:
    get:
      operationId: getCompetitionEligibility
      tags:
        - Competitions
      summary: Evaluate every current registration requirement for the signed-in player.
      description: >-
        This is a private writer-side decision and must not be shared-cached. A paid competition can be eligible while
        canRegisterNow is false and requiredAction is start_payment. Registration/payment handlers must evaluate the
        same policy again in their write transaction because capacity and deadlines can change.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gameAccountId
          in: query
          required: false
          description: Omit to discover that selecting a connected account is required.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A complete eligibility decision, including every blocking/action issue.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetitionEligibilityResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/admin/payment-reviews:
