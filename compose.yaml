name: gamics

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=256MB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gamics_postgres:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro

  postgres-replication-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-development-replication-secret}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/postgres/init-replication.sh:/scripts/init-replication.sh:ro
    entrypoint: ["/bin/sh", "/scripts/init-replication.sh"]

  postgres-replica:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_PRIMARY_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_REPLICATION_USER: gamics_replica
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-development-replication-secret}
      PGPASSFILE: /var/lib/postgresql/.pgpass
    ports:
      - "${POSTGRES_REPLICA_PORT:-5433}:5432"
    depends_on:
      postgres-replication-init:
        condition: service_completed_successfully
    volumes:
      - gamics_postgres_replica:/var/lib/postgresql/data
      - ./infra/postgres/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/scripts/replica-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && test \"$$(psql -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT pg_is_in_recovery()')\" = t"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-development-redis-secret}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - gamics_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gamics-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-minio-secret-change-me}
      MINIO_SITE_REGION: ${STORAGE_S3_REGION:-af-south-1}
    ports:
      - "${MINIO_API_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - gamics_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gamics-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-minio-secret-change-me}
      MINIO_BUCKET: ${STORAGE_S3_BUCKET:-gamics-local}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-gamics-api-local}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-development-gamics-api-storage-secret}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        if [ "$${STORAGE_S3_ACCESS_KEY}" = "$${MINIO_ROOT_USER}" ]; then
          echo "STORAGE_S3_ACCESS_KEY must be a separate bucket-scoped application user" >&2
          exit 1
        fi

        policy_file=/tmp/gamics-api-bucket-policy.json
        cat > "$${policy_file}" <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation"],
              "Resource": ["arn:aws:s3:::$${MINIO_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject"],
              "Resource": ["arn:aws:s3:::$${MINIO_BUCKET}/*"]
            }
          ]
        }
        EOF
        mc admin policy create local gamics-api-bucket-access "$${policy_file}"
        mc admin user add local "$${STORAGE_S3_ACCESS_KEY}" "$${STORAGE_S3_SECRET_KEY}"
        user_info="$$(mc admin user info --json local "$${STORAGE_S3_ACCESS_KEY}")"
        policy_names="$$(printf '%s\n' "$${user_info}" | sed -n 's/.*"policyName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
        if [ "$${policy_names}" != gamics-api-bucket-access ]; then
          # Recreate the fixed application user so an older broad policy such
          # as readwrite cannot survive migration to the bucket-only policy.
          mc admin user remove local "$${STORAGE_S3_ACCESS_KEY}"
          mc admin user add local "$${STORAGE_S3_ACCESS_KEY}" "$${STORAGE_S3_SECRET_KEY}"
          mc admin policy attach local gamics-api-bucket-access --user "$${STORAGE_S3_ACCESS_KEY}"
        fi

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        VERSION: ${GAMICS_VERSION:-dev}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_WRITE_URL: ${DATABASE_WRITE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
      DATABASE_READ_URL: ${DATABASE_READ_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB}?sslmode=disable}
      DATABASE_WRITE_MAX_CONNS: ${DATABASE_WRITE_MAX_CONNS:-8}
      DATABASE_READ_MAX_CONNS: ${DATABASE_READ_MAX_CONNS:-16}
      DATABASE_MAX_REPLICA_LAG: ${DATABASE_MAX_REPLICA_LAG:-5s}
      DATABASE_FALLBACK_MAX_CONCURRENCY: ${DATABASE_FALLBACK_MAX_CONCURRENCY:-16}
      REDIS_URL: redis://:${REDIS_PASSWORD:-development-redis-secret}@redis:6379/0
      REDIS_SECURITY_URL: ${REDIS_SECURITY_URL:-redis://:${REDIS_PASSWORD:-development-redis-secret}@redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://:${REDIS_PASSWORD:-development-redis-secret}@redis:6379/0}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-gamics:development:v1}
      GAME_CATALOG_CACHE_TTL: ${GAME_CATALOG_CACHE_TTL:-12h}
      AUTH_SESSION_CACHE_TTL: ${AUTH_SESSION_CACHE_TTL:-30s}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-development-only-auth-token-secret-change-me}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-development-only-otp-hash-secret-change-me}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      OTP_TTL: ${OTP_TTL:-10m}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_REQUEST_WINDOW: ${OTP_REQUEST_WINDOW:-15m}
      OTP_EMAIL_LIMIT: ${OTP_EMAIL_LIMIT:-5}
      OTP_IP_LIMIT: ${OTP_IP_LIMIT:-20}
      LOGIN_FAILURE_WINDOW: ${LOGIN_FAILURE_WINDOW:-15m}
      LOGIN_ACCOUNT_FAILURES: ${LOGIN_ACCOUNT_FAILURES:-10}
      LOGIN_IP_FAILURES: ${LOGIN_IP_FAILURES:-50}
      REGISTRATION_WINDOW: ${REGISTRATION_WINDOW:-1h}
      REGISTRATION_IP_LIMIT: ${REGISTRATION_IP_LIMIT:-10}
      EMAIL_MODE: ${EMAIL_MODE:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10s}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      FX_RATES_URL: ${FX_RATES_URL:-https://api.frankfurter.dev/v2/rates?base=USD}
      FX_REFRESH_INTERVAL: ${FX_REFRESH_INTERVAL:-6h}
      VISION_URL: ${VISION_URL:-}
      VISION_TOKEN: ${VISION_TOKEN:-}
      VISION_TIMEOUT: ${VISION_TIMEOUT:-30s}
      VISION_CONCURRENCY: ${VISION_CONCURRENCY:-2}
      VISION_AUTO_DECIDE: ${VISION_AUTO_DECIDE:-false}
      VISION_AUTO_MIN_CONFIDENCE: ${VISION_AUTO_MIN_CONFIDENCE:-0.9}
      VISION_WORKER: ${VISION_WORKER:-true}
      VISION_TRAINING_TOKEN: ${VISION_TRAINING_TOKEN:-}
      VISION_TRAINING_CIDRS: ${VISION_TRAINING_CIDRS:-}
      MPESA_ENVIRONMENT: ${MPESA_ENVIRONMENT:-disabled}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORT_CODE: ${MPESA_SHORT_CODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_BASE_URL: ${MPESA_CALLBACK_BASE_URL:-}
      MPESA_CALLBACK_TOKEN: ${MPESA_CALLBACK_TOKEN:-}
      MPESA_TRANSACTION_TYPE: ${MPESA_TRANSACTION_TYPE:-CustomerPayBillOnline}
      MPESA_TIMEOUT: ${MPESA_TIMEOUT:-15s}
      MPESA_MAX_AMOUNT_MINOR: ${MPESA_MAX_AMOUNT_MINOR:-1000000}
      MPESA_USER_LIMIT: ${MPESA_USER_LIMIT:-5}
      MPESA_PHONE_LIMIT: ${MPESA_PHONE_LIMIT:-8}
      MPESA_IP_LIMIT: ${MPESA_IP_LIMIT:-20}
      MPESA_USER_WINDOW: ${MPESA_USER_WINDOW:-15m}
      MPESA_PHONE_WINDOW: ${MPESA_PHONE_WINDOW:-1h}
      MPESA_IP_WINDOW: ${MPESA_IP_WINDOW:-1h}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      EXPO_PUSH_URL: ${EXPO_PUSH_URL:-https://exp.host/--/api/v2/push/send}
      EXPO_RECEIPTS_URL: ${EXPO_RECEIPTS_URL:-https://exp.host/--/api/v2/push/getReceipts}
      EXPO_PUSH_TIMEOUT: ${EXPO_PUSH_TIMEOUT:-10s}
      EXPO_RECEIPT_INITIAL_DELAY: ${EXPO_RECEIPT_INITIAL_DELAY:-30s}
      EXPO_RECEIPT_RETRY_BASE: ${EXPO_RECEIPT_RETRY_BASE:-30s}
      EXPO_RECEIPT_BATCH: ${EXPO_RECEIPT_BATCH:-300}
      EXPO_RECEIPT_MAX_ATTEMPTS: ${EXPO_RECEIPT_MAX_ATTEMPTS:-12}
      NOTIFICATION_POLL_INTERVAL: ${NOTIFICATION_POLL_INTERVAL:-1s}
      NOTIFICATION_PROJECT_BATCH: ${NOTIFICATION_PROJECT_BATCH:-50}
      NOTIFICATION_PUSH_BATCH: ${NOTIFICATION_PUSH_BATCH:-100}
      NOTIFICATION_PUSH_MAX_ATTEMPTS: ${NOTIFICATION_PUSH_MAX_ATTEMPTS:-8}
      RESULT_STRIKE_BAN_THRESHOLD: ${RESULT_STRIKE_BAN_THRESHOLD:-3}
      STORAGE_MODE: ${STORAGE_MODE:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      STORAGE_S3_PUBLIC_ENDPOINT: "${STORAGE_S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_API_PORT:-9000}}"
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-af-south-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-gamics-local}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-gamics-api-local}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-development-gamics-api-storage-secret}
      STORAGE_S3_SESSION_TOKEN: ${STORAGE_S3_SESSION_TOKEN:-}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-true}
      STORAGE_PRESIGN_TTL: ${STORAGE_PRESIGN_TTL:-10m}
      STORAGE_HTTP_TIMEOUT: ${STORAGE_HTTP_TIMEOUT:-10s}
      EVIDENCE_MAX_BYTES: ${EVIDENCE_MAX_BYTES:-10485760}
      EVIDENCE_UPLOAD_LIMIT: ${EVIDENCE_UPLOAD_LIMIT:-30}
      EVIDENCE_DAILY_BYTES: ${EVIDENCE_DAILY_BYTES:-536870912}
      EVIDENCE_ACTION_LIMIT: ${EVIDENCE_ACTION_LIMIT:-120}
      AVATAR_UPLOAD_LIMIT: ${AVATAR_UPLOAD_LIMIT:-10}
      AVATAR_DAILY_BYTES: ${AVATAR_DAILY_BYTES:-67108864}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SHUTDOWN_TIMEOUT: 10s
      REQUEST_TIMEOUT: 15s
      READ_HEADER_TIMEOUT: 5s
      READ_TIMEOUT: 15s
      WRITE_TIMEOUT: 30s
      IDLE_TIMEOUT: 90s
      MAX_HEADER_BYTES: 32768
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s

  evidence-worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/gamics-evidence-worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_WRITE_URL: ${EVIDENCE_WORKER_DATABASE_URL:-${DATABASE_WRITE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}}
      STORAGE_MODE: ${STORAGE_MODE:-s3}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-af-south-1}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-gamics-local}
      STORAGE_S3_ACCESS_KEY: ${EVIDENCE_WORKER_S3_ACCESS_KEY:-${STORAGE_S3_ACCESS_KEY:-gamics-api-local}}
      STORAGE_S3_SECRET_KEY: ${EVIDENCE_WORKER_S3_SECRET_KEY:-${STORAGE_S3_SECRET_KEY:-development-gamics-api-storage-secret}}
      STORAGE_S3_SESSION_TOKEN: ${EVIDENCE_WORKER_S3_SESSION_TOKEN:-${STORAGE_S3_SESSION_TOKEN:-}}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-true}
      STORAGE_HTTP_TIMEOUT: ${STORAGE_HTTP_TIMEOUT:-10s}
      EVIDENCE_WORKER_CONCURRENCY: ${EVIDENCE_WORKER_CONCURRENCY:-2}
      EVIDENCE_WORKER_RETRY_WINDOW: ${EVIDENCE_WORKER_RETRY_WINDOW:-5m}
      EVIDENCE_WORKER_MAX_BACKOFF: ${EVIDENCE_WORKER_MAX_BACKOFF:-30s}
      EVIDENCE_WORKER_UPLOAD_GRACE: ${EVIDENCE_WORKER_UPLOAD_GRACE:-2m}
      EVIDENCE_WORKER_MAX_LEASE_RECOVERIES: ${EVIDENCE_WORKER_MAX_LEASE_RECOVERIES:-2}
      # Startup requires concurrency x 25 MiB + this budget + 64 MiB to fit
      # GOMEMLIMIT: 2 x 25 + 192 + 64 = 306 MiB of 384 MiB by default.
      EVIDENCE_WORKER_DECODE_BUDGET_BYTES: ${EVIDENCE_WORKER_DECODE_BUDGET_BYTES:-201326592}
      EVIDENCE_WORKER_HTTP_ADDR: :8081
      HEALTHCHECK_PORT: "8081"
      GOMEMLIMIT: 384MiB
    mem_limit: 512m
    cpus: 2
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 40s

  # Screenshot reader (docs/screenshot-reader.md): the team's Python service in
  # its own repository (tonitsOCR, on the EasyOCR fork), which reads the
  # eFootball Full Time screen. This stub only wires it in. It is off by
  # default. Start it with
  #   docker compose --env-file .env.docker --profile vision up -d --build
  # and point the API at it with VISION_URL=http://vision:8000 and the same
  # VISION_TOKEN. Only the API calls it, so it publishes no port. The build
  # needs a service Dockerfile that runs the HTTP server (POST /v1/read,
  # GET /healthz on port 8000); set VISION_IMAGE to use a prebuilt image.
  vision:
    profiles: ["vision"]
    image: ${VISION_IMAGE:-tonits-vision:local}
    build:
      context: ${VISION_BUILD_CONTEXT:-../tonitsOCR/EasyOCR}
      dockerfile: ${VISION_DOCKERFILE:-tonits_vision/Dockerfile}
    restart: unless-stopped
    environment:
      PORT: "8000"
      # Requests from the API carry this as "Authorization: Bearer <token>".
      VISION_TOKEN: ${VISION_TOKEN:-}
      # The reader's own settings (see tonits_vision/reader.py).
      VISION_RECOGNIZER: ${VISION_RECOGNIZER:-english_g2}
      VISION_MODEL_DIR: ${VISION_MODEL_DIR:-/models}
      VISION_USER_NETWORK_DIR: ${VISION_USER_NETWORK_DIR:-/models}
      # Models are baked into the image; never download at runtime.
      VISION_DOWNLOAD_MODELS: "0"
      # Requests waiting beyond this get 503 busy, which the API retries in
      # seconds; this is the reader's back-pressure.
      VISION_MAX_QUEUE: ${VISION_MAX_QUEUE:-4}
      # Optional vision-LLM second opinion for low-confidence reads. Empty
      # disables it, so the reader never pays for an outside model.
      VISION_FALLBACK_API_KEY: ${VISION_FALLBACK_API_KEY:-}
      VISION_FALLBACK_MODEL: ${VISION_FALLBACK_MODEL:-claude-haiku-4-5-20251001}
      VISION_FALLBACK_BELOW: ${VISION_FALLBACK_BELOW:-0.6}
    expose:
      - "8000"
    # One reader process reads one image at a time on CPU (1-4 s). Scale out
    # with replicas, not threads.
    mem_limit: ${VISION_MEM_LIMIT:-2g}
    cpus: ${VISION_CPUS:-2}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # Loading the OCR models takes a while on first start.
      start_period: 60s
    stop_grace_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Server-side fetches run inside the compose network, where the API is the
      # service name. PUBLIC_API_URL is the browser-facing address and is not
      # reachable from this container.
      API_URL: http://api:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  gamics_postgres:
  gamics_postgres_replica:
  gamics_redis:
  gamics_minio:
