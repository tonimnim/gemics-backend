      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ResultReviewStatus'
        - name: competitionId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Signed cursor bound to the operator and every filter. It expires after 15 minutes.
          schema:
            type: string
      responses:
        '200':
          description: Review queue page.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultReviewPageEnvelope'
        '400':
          $ref: '#/components/responses/Error'
          description: invalid_status, invalid_competition, invalid_limit, invalid_cursor.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: platform_access_denied.
        '500':
          $ref: '#/components/responses/Error'
          description: internal_error.
        '503':
          $ref: '#/components/responses/Error'
          description: database_unavailable.
  /v1/admin/result-reviews/{id}:
    get:
      operationId: getResultReview
      tags:
        - Platform result review
      summary: Get one review with both entries' claims, screenshots and strike history.
      description: Screenshots are fetched through GET /v1/evidence/{id}, which checks the reviewer again.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review detail.
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultReviewEnvelope'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: >-
            platform_access_denied; result_review_conflict (the operator plays in, captains in or organizes
            this match).
        '404':
          $ref: '#/components/responses/Error'
          description: result_review_not_found (unknown or malformed id).
        '500':
          $ref: '#/components/responses/Error'
          description: internal_error.
        '503':
          $ref: '#/components/responses/Error'
          description: database_unavailable.
  /v1/admin/result-reviews/{id}/decisions:
    post:
      operationId: decideResultReview
      tags:
        - Platform result review
      summary: Decide a queued review and settle the match.
      description: >-
        accept_home or accept_away confirms that entry's current claim (its final report, or its initial
        report when it has none); corrected_score confirms a score Gamics sets; all three apply progression
        and ratings. remove_both cancels the match and removes both entries from the tournament without
        touching ratings. strikeUserIds may name only the reporter of a current claim that this decision
        rejects; each strike counts towards the registration ban until an admin revokes it. The decision
        is audited and both entries receive the same push, without the score.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultReviewDecisionRequest'
            examples:
              acceptHome:
                value:
                  expectedVersion: 1
                  decision: accept_home
                  strikeUserIds:
                    - 4d3e5536-bf3c-4dba-a643-575e43f56970
                  note: The away screenshot shows a different match.
              corrected:
                value:
                  expectedVersion: 1
                  decision: corrected_score
                  correctedScore:
                    homeScore: 3
                    awayScore: 2
                  note: Both screenshots show 3-2 after extra time.
      responses:
        '200':
          description: Decision recorded. The body is the updated review detail.
          headers:
            Idempotency-Replayed:
              description: Present with the value true when the stored response for this key was replayed.
              schema:
                type: string
                enum:
                  - 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultReviewEnvelope'
        '400':
          $ref: '#/components/responses/Error'
          description: >-
            idempotency_key_required, invalid_idempotency_key; invalid_request; invalid_review_decision
            (unknown decision, correctedScore present or missing for the wrong decision, note outside
            10..2000 characters, expectedVersion below 1); invalid_score (the corrected score does not
            fit the stage); invalid_strike_user (more than two users, or a user who is not the reporter
            of a rejected claim).
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
          description: platform_access_denied; result_review_conflict.
        '404':
          $ref: '#/components/responses/Error'
          description: result_review_not_found.
        '409':
          $ref: '#/components/responses/Error'
          description: >-
            competition_closed (the competition is cancelled or completed); review_already_decided (the
            review is decided or closed); review_version_conflict (expectedVersion is stale); match_changed;
            idempotency_conflict.
        '500':
          $ref: '#/components/responses/Error'
          description: internal_error.
        '503':
          $ref: '#/components/responses/Error'
          description: database_unavailable.
  /v1/admin/player-strikes:
    get:
      operationId: listPlayerStrikes
      tags:
