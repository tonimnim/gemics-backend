# Isolated single-host approximation, not a HA production deployment.
# Merge AFTER compose.yaml and compose.r2.yaml; use project gamics-loadtest.
services:
  postgres:
    ports: !override ["127.0.0.1:15432:5432"]
    mem_limit: 1g
    cpus: 2
  postgres-replica:
    ports: !override ["127.0.0.1:15433:5432"]
    mem_limit: 1g
    cpus: 1
  redis:
    ports: !override ["127.0.0.1:16379:6379"]
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    mem_limit: 512m
  redis-cache:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["/bin/sh", "-c", "exec redis-server --save '' --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["127.0.0.1:18025:8025"]
    mem_limit: 128m
  migrate:
    image: gamics-loadtest-api:local
    pull_policy: never
    restart: "no"
    entrypoint: ["/usr/local/bin/gamics-migrate"]
    environment:
      DATABASE_WRITE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: gamics-loadtest-api:local
    ports: !reset []
    environment:
      APP_ENV: production
      RUN_MIGRATIONS: "false"
      REDIS_CACHE_URL: redis://:${REDIS_PASSWORD}@redis-cache:6379/0
      EMAIL_MODE: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: loadtest@gamics.test
      SMTP_REQUIRE_TLS: "false"
      MPESA_ENVIRONMENT: disabled
      EXPO_ACCESS_TOKEN: ""
      GOMEMLIMIT: 384MiB
    mem_limit: 512m
    cpus: 1
    depends_on: !override
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
  evidence-worker:
    image: gamics-loadtest-api:local
    environment:
      APP_ENV: production
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 128m
    volumes:
      - ./infra/loadtest/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
  web:
    profiles: [marketing]
